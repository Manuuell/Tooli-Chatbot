services:

  backend:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - tooli-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no  # sin persistencia — sesiones son efímeras
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - tooli-net

  evolution-postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    volumes:
      - evolution-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      tooli-net:
        aliases:
          - postgres

  # Evolution API — instancia Baileys
  evolution-api:
    build:
      context: .
      dockerfile: Dockerfile.evolution
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - DATABASE_PROVIDER=postgresql
      - DATABASE_URL=postgresql://user:pass@postgres:5432/evolution
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - WEBHOOK_GLOBAL_URL=http://backend:3000/webhook
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379
      - CACHE_REDIS_PREFIX_KEY=evolution
      - QRCODE_LIMIT=30
      - QRCODE_COLOR=#000000
      - CONFIG_SESSION_PHONE_VERSION=2.3000.1035194821
    volumes:
      - evolution-instances:/evolution/instances
    depends_on:
      evolution-postgres:
        condition: service_healthy
    networks:
      - tooli-net

  # Typebot — motor conversacional
  typebot-builder:
    image: baptistearno/typebot-builder:latest
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file: .env.typebot
    networks:
      - tooli-net

  typebot-viewer:
    image: baptistearno/typebot-viewer:latest
    restart: unless-stopped
    ports:
      - "3002:3000"
    env_file: .env.typebot
    networks:
      - tooli-net

  # Chatwoot — handoff humano
  chatwoot:
    image: chatwoot/chatwoot:latest
    restart: unless-stopped
    ports:
      - "3003:3000"
    env_file: .env.chatwoot
    depends_on:
      - chatwoot-postgres
      - chatwoot-redis
    command: bundle exec rails s -b 0.0.0.0
    networks:
      - tooli-net

  chatwoot-postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: ${CHATWOOT_DB_PASSWORD}
    volumes:
      - chatwoot-pg-data:/var/lib/postgresql/data
    networks:
      - tooli-net

  chatwoot-redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - tooli-net

volumes:
  evolution-instances:
  evolution-pg-data:
  chatwoot-pg-data:

networks:
  tooli-net:
    driver: bridge
