global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: tooli

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: tooli-bot
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:3000
    params:
      token:
        - "__TOKEN__"

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
