<script>
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

let currentUser = null;
let publicUrls = { chatwoot: '#', grafana: '#' };
let capabilities = { chatwootSso: false };

/* ============= Microinteracciones: haptics, toast, action sheet, long-press ============= */
function haptic(pattern) {
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch {}
}

function toast(msg, ms = 2200) {
  const stack = $('#toastStack');
  if (!stack) return;
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  stack.appendChild(el);
  setTimeout(() => {
    el.classList.add('hide');
    setTimeout(() => el.remove(), 260);
  }, ms);
}

function copyToClipboard(text, label = 'Copiado') {
  try {
    navigator.clipboard?.writeText(text);
    toast(`${label} ✓`);
    haptic(15);
  } catch {
    toast('No se pudo copiar');
  }
}

/* Tooltip flotante ("ventana de texto") — hover en desktop, tap en touch */
function attachTooltip(el, text) {
  if (!text) return;
  el.classList.add('tt-anchor');
  const bubble = document.createElement('span');
  bubble.className = 'tt-bubble';
  bubble.textContent = text;
  el.appendChild(bubble);
  const show = () => el.classList.add('tt-visible');
  const hide = () => el.classList.remove('tt-visible');
  el.addEventListener('mouseenter', show);
  el.addEventListener('mouseleave', hide);
  el.addEventListener('touchstart', (e) => { e.stopPropagation(); show(); setTimeout(hide, 1800); }, { passive: true });
}

/* Control segmentado estilo iOS (reemplaza <select> simples) */
function buildSegmented(options, activeValue, onChange) {
  const wrap = document.createElement('div');
  wrap.className = 'segmented';
  const thumb = document.createElement('div');
  thumb.className = 'segmented-thumb';
  wrap.appendChild(thumb);
  const buttons = options.map(opt => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = opt.label;
    btn.dataset.value = opt.value;
    btn.addEventListener('click', () => {
      if (btn.classList.contains('active')) return;
      haptic(10);
      setActive(opt.value);
      onChange(opt.value);
    });
    wrap.appendChild(btn);
    return btn;
  });
  function setActive(value) {
    buttons.forEach(b => b.classList.toggle('active', b.dataset.value === value));
    const activeBtn = buttons.find(b => b.dataset.value === value);
    if (activeBtn) { thumb.style.left = `${activeBtn.offsetLeft}px`; thumb.style.width = `${activeBtn.offsetWidth}px`; }
  }
  requestAnimationFrame(() => setActive(activeValue));
  return wrap;
}

/* Contador animado (ease-out cúbico) para los números de las stat cards */
function countUp(el, to, duration = 650) {
  const from = 0;
  const t0 = performance.now();
  function frame(now) {
    const p = Math.min(1, (now - t0) / duration);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(from + (to - from) * eased);
    if (p < 1) requestAnimationFrame(frame);
    else el.textContent = to;
  }
  requestAnimationFrame(frame);
}

/* Anillo de progreso circular (espera de descarga de recibo) */
const RING_C = 150.8;
function buildProgressRing(id) {
  return `<div class="progress-ring" id="${id}">
    <svg width="56" height="56" viewBox="0 0 56 56">
      <circle class="track" cx="28" cy="28" r="24"></circle>
      <circle class="fill" id="${id}-fill" cx="28" cy="28" r="24" stroke-dasharray="${RING_C}" stroke-dashoffset="${RING_C}"></circle>
    </svg>
    <span class="pct" id="${id}-pct">0%</span>
  </div>`;
}
function setProgress(id, pct) {
  const fill = document.getElementById(`${id}-fill`);
  const label = document.getElementById(`${id}-pct`);
  if (!fill) return;
  fill.style.strokeDashoffset = String(RING_C - (RING_C * pct / 100));
  if (label) label.textContent = `${Math.round(pct)}%`;
}

/* Check de éxito animado (el trazo del SVG se "dibuja" solo) */
function successCheckSvg() {
  return `<svg class="success-check" viewBox="0 0 66 66" xmlns="http://www.w3.org/2000/svg">
    <circle cx="33" cy="33" r="28"></circle>
    <path d="M19 34l10 10 18-19"></path>
  </svg>`;
}

const HEALTH_LABELS = {
  ok: 'Operativo', degraded: 'Degradado', down: 'Caído', skipped: 'No verificado',
};

const ActionSheet = {
  _escHandler: null,
  open({ title, subtitle, groups }) {
    this.close();
    haptic(12);
    const backdrop = document.createElement('div');
    backdrop.className = 'sheet-backdrop';
    backdrop.id = 'activeSheet';

    const sheet = document.createElement('div');
    sheet.className = 'action-sheet';
    sheet.setAttribute('role', 'dialog');
    sheet.setAttribute('aria-modal', 'true');
    if (title) sheet.setAttribute('aria-label', String(title).replace(/<[^>]*>/g, ''));
    // Se recuerda quién tenía el foco para devolvérselo al cerrar: si no, el
    // teclado queda "perdido" al principio de la página tras cada sheet.
    this._focoPrevio = document.activeElement;

    let html = '<div class="sheet-grabber"></div>';
    if (title) {
      html += `<div class="sheet-header"><div class="sheet-title">${title}</div>${subtitle ? `<div class="sheet-subtitle">${subtitle}</div>` : ''}</div>`;
    }
    const flat = [];
    groups.forEach(group => {
      html += '<div class="sheet-group">' + group.map(a => {
        flat.push(a);
        const cls = [a.destructive ? 'destructive' : '', a.cancel ? 'cancel' : ''].filter(Boolean).join(' ');
        return `<button type="button" class="sheet-action ${cls}">${a.icon ? `<span class="sheet-icon">${a.icon}</span>` : ''}${a.label}</button>`;
      }).join('') + '</div>';
    });
    sheet.innerHTML = html;
    backdrop.appendChild(sheet);
    document.body.appendChild(backdrop);

    $$('.sheet-action', sheet).forEach((btn, i) => btn.addEventListener('click', () => {
      this.close();
      flat[i].onClick && flat[i].onClick();
    }));
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) this.close(); });

    let startY = null;
    sheet.addEventListener('touchstart', e => { startY = e.touches[0].clientY; }, { passive: true });
    sheet.addEventListener('touchmove', e => {
      if (startY == null) return;
      const dy = e.touches[0].clientY - startY;
      if (dy > 0) sheet.style.transform = `translateY(${dy}px)`;
    }, { passive: true });
    sheet.addEventListener('touchend', e => {
      const dy = e.changedTouches[0].clientY - startY;
      sheet.style.transform = '';
      startY = null;
      if (dy > 80) this.close();
    });

    this._escHandler = (e) => { if (e.key === 'Escape') this.close(); };
    document.addEventListener('keydown', this._escHandler);
    requestAnimationFrame(() => backdrop.classList.add('open'));
    // El foco va con temporizador y no con otro requestAnimationFrame: rAF no
    // corre cuando la pestaña está en segundo plano, y entonces el sheet se
    // quedaría sin foco de teclado al volver a ella.
    setTimeout(() => sheet.querySelector('.sheet-action:not(.cancel)')?.focus({ preventScroll: true }), 60);
  },
  close() {
    const el = document.getElementById('activeSheet');
    if (this._escHandler) { document.removeEventListener('keydown', this._escHandler); this._escHandler = null; }
    if (this._focoPrevio?.isConnected) { this._focoPrevio.focus({ preventScroll: true }); }
    this._focoPrevio = null;
    if (!el) return;
    el.classList.remove('open');
    setTimeout(() => el.remove(), 260);
  },
};

function contextSheet(el, { title, subtitle, actions }) {
  attachLongPress(el, () => {
    ActionSheet.open({
      title, subtitle,
      groups: [actions, [{ label: 'Cancelar', cancel: true }]],
    });
  });
}

function attachLongPress(el, handler, opts = {}) {
  const delay = opts.delay ?? 460;
  let timer = null, moved = false, startX = 0, startY = 0, active = false;
  el.classList.add('longpressable');
  const clear = () => {
    clearTimeout(timer); timer = null;
    if (active) { el.classList.remove('longpress-active'); active = false; }
  };
  el.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    moved = false; startX = e.clientX; startY = e.clientY;
    timer = setTimeout(() => {
      if (moved) return;
      active = true;
      el.classList.add('longpress-active');
      const swallowClick = (ev) => { ev.preventDefault(); ev.stopImmediatePropagation(); };
      el.addEventListener('click', swallowClick, { capture: true, once: true });
      setTimeout(() => el.removeEventListener('click', swallowClick, { capture: true }), 700);
      handler();
    }, delay);
  });
  el.addEventListener('pointermove', (e) => {
    if (Math.abs(e.clientX - startX) > 10 || Math.abs(e.clientY - startY) > 10) { moved = true; clear(); }
  });
  el.addEventListener('pointerup', clear);
  el.addEventListener('pointerleave', clear);
  el.addEventListener('pointercancel', clear);
  el.addEventListener('contextmenu', (e) => e.preventDefault());
}

function icon(name, size = 20) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="icon-svg">${ICONS[name] ?? ''}</svg>`;
}

/* ============= PULL TO REFRESH =============
   Patrón de FastFood traducido a JS puro: arrastre con resistencia (no 1:1),
   el spinner rota siguiendo el dedo, haptic al cruzar el umbral y solo se
   dispara si efectivamente se pasó. Se activa únicamente cuando la página
   ya está arriba del todo, para no pelearse con el scroll normal. */
const PTR_UMBRAL = 62;
const PTR_MAX = 96;
let ptrHandler = null;   // callback de la pantalla actual (null = sin recarga)
let ptrIndicador = null;

/** Cada pantalla con datos registra acá cómo recargarse. navigate() lo limpia. */
function setPullToRefresh(fn) { ptrHandler = fn; }

function ptrGetIndicador() {
  if (ptrIndicador) return ptrIndicador;
  ptrIndicador = document.createElement('div');
  ptrIndicador.className = 'ptr-indicator';
  ptrIndicador.setAttribute('aria-hidden', 'true');
  ptrIndicador.innerHTML = `<span class="ptr-spinner">${icon('refresh', 20)}</span>`;
  document.body.appendChild(ptrIndicador);
  return ptrIndicador;
}

(function initPullToRefresh() {
  let startY = null;
  let activo = false;
  let cruzado = false;
  let recargando = false;

  document.addEventListener('touchstart', (e) => {
    if (recargando || !ptrHandler || e.touches.length !== 1) return;
    // Solo si ya estamos arriba del todo y el dedo no empezó dentro de un
    // contenedor con su propio scroll (el hilo de mensajes, por ejemplo).
    if (window.scrollY > 4) return;
    const dentroDeScroll = e.target.closest?.('.inbox-messages, .profile-sheet, .action-sheet');
    if (dentroDeScroll) return;
    startY = e.touches[0].clientY;
    activo = true;
    cruzado = false;
  }, { passive: true });

  document.addEventListener('touchmove', (e) => {
    if (!activo || startY == null) return;
    const dy = e.touches[0].clientY - startY;
    if (dy <= 0) return;
    const dist = Math.min(PTR_MAX, dy * 0.45);   // resistencia
    const ind = ptrGetIndicador();
    ind.style.transform = `translate(-50%, ${dist}px)`;
    ind.style.opacity = String(Math.min(1, dist / PTR_UMBRAL));
    ind.querySelector('.ptr-spinner').style.transform = `rotate(${dist * 4}deg)`;
    if (dist >= PTR_UMBRAL && !cruzado) { cruzado = true; haptic(12); ind.classList.add('ready'); }
    if (dist < PTR_UMBRAL && cruzado) { cruzado = false; ind.classList.remove('ready'); }
  }, { passive: true });

  const soltar = async () => {
    if (!activo) return;
    activo = false;
    startY = null;
    const ind = ptrGetIndicador();

    if (!cruzado || !ptrHandler) {
      ind.style.transform = '';
      ind.style.opacity = '0';
      ind.classList.remove('ready');
      return;
    }

    recargando = true;
    ind.classList.add('loading');
    ind.style.transform = `translate(-50%, ${PTR_UMBRAL}px)`;
    try { await ptrHandler(); } catch { /* la pantalla ya muestra su propio error */ }
    haptic([10, 18, 10]);
    ind.classList.remove('loading', 'ready');
    ind.style.transform = '';
    ind.style.opacity = '0';
    recargando = false;
    cruzado = false;
  };
  document.addEventListener('touchend', soltar, { passive: true });
  document.addEventListener('touchcancel', soltar, { passive: true });
})();

/* ============= Tab bar móvil ============= */
const TAB_ROUTES = [
  { route: 'home', icon: 'home', label: 'Inicio' },
  { route: 'turno', icon: 'clipboard', label: 'Turno' },
  { route: 'recibo', icon: 'receipt', label: 'Recibo' },
  { route: 'posgrados', icon: 'cap', label: 'Posgrados' },
];
function moreRoutes() {
  const routes = [
    { route: 'metricas', icon: 'chart', label: 'Métricas' },
    { route: 'conversaciones', icon: 'message', label: 'Conversaciones' },
    { route: 'registros', icon: 'users', label: 'Registros BD' },
    { route: 'evento-posgrado', icon: 'bell', label: 'Evento posgrados' },
    { route: 'recordatorios', icon: 'clock', label: 'Recordatorios' },
    { route: 'health', icon: 'pulse', label: 'Estado del sistema' },
  ];
  if (currentUser?.role === 'admin') {
    routes.push({ route: 'actividad', icon: 'chart', label: 'Actividad de asesores' });
    routes.push({ route: 'usuarios', icon: 'users', label: 'Asesores' });
  }
  return routes;
}

function renderTabBar() {
  const bar = $('#tabBar');
  if (!bar) return;
  const tabs = [...TAB_ROUTES, { route: '__more', icon: 'more', label: 'Más' }];
  bar.innerHTML = tabs.map(t => `
    <button type="button" class="tab-item" data-tab="${t.route}">
      <span class="tab-notch"></span>
      <span class="tab-icon">${icon(t.icon, 23)}</span>
      <span class="tab-label">${t.label}</span>
    </button>
  `).join('');
  $$('.tab-item', bar).forEach(btn => btn.addEventListener('click', () => {
    haptic(10);
    if (btn.dataset.tab === '__more') return openMoreSheet();
    navigate(btn.dataset.tab);
  }));
  updateTabBar(location.hash.slice(1) || 'home');
}

function updateTabBar(route) {
  const bar = $('#tabBar');
  if (!bar) return;
  const isMore = moreRoutes().some(r => r.route === route);
  $$('.tab-item', bar).forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === route || (btn.dataset.tab === '__more' && isMore));
  });
}

function openMoreSheet() {
  const actions = moreRoutes().map(r => ({ label: r.label, icon: icon(r.icon, 16), onClick: () => navigate(r.route) }));
  actions.push({ label: 'Cerrar sesión', icon: icon('logout', 16), destructive: true, onClick: doLogout });
  ActionSheet.open({
    title: currentUser?.fullName ?? 'Más',
    subtitle: currentUser?.role === 'admin' ? 'Administrador' : 'Asesor',
    groups: [actions, [{ label: 'Cancelar', cancel: true }]],
  });
}

async function doLogout() {
  await api('/api/auth/logout', { method: 'POST' });
  window.location.href = '/app/login.html';
}

async function api(path, opts = {}) {
  const res = await fetch(path, { credentials: 'same-origin', ...opts, headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) } });
  if (res.status === 401) { window.location.href = '/app/login.html'; return; }
  return res;
}

const NAV_ROUTES = [
  { route: 'home', icon: 'home', label: 'Inicio' },
  { route: 'turno', icon: 'clipboard', label: 'Consultar turno' },
  { route: 'recibo', icon: 'receipt', label: 'Descargar recibo' },
  { route: 'metricas', icon: 'chart', label: 'Métricas' },
  { route: 'conversaciones', icon: 'message', label: 'Conversaciones' },
  { route: 'posgrados', icon: 'cap', label: 'Posgrados' },
  { route: 'registros', icon: 'users', label: 'CRM · Prospectos' },
  { route: 'evento-posgrado', icon: 'bell', label: 'Evento posgrados' },
  { route: 'recordatorios', icon: 'clock', label: 'Recordatorios' },
  { route: 'health', icon: 'pulse', label: 'Estado del sistema' },
];

function renderSidebarNav() {
  const nav = $('#nav');
  nav.innerHTML = NAV_ROUTES.map(r => `<a data-route="${r.route}">${icon(r.icon)}${r.label}</a>`).join('')
    + (currentUser?.role === 'admin' ? `<a data-route="actividad">${icon('pulse')}Actividad de asesores</a><a data-route="usuarios" id="navUsuarios">${icon('users')}Asesores</a>` : '');
  $$('#nav a').forEach(a => a.addEventListener('click', e => {
    e.preventDefault();
    navigate(a.dataset.route);
  }));
}

async function init() {
  const r = await api('/api/auth/me');
  if (!r) return;
  const data = await r.json();
  currentUser = data.user;
  if (data.urls) publicUrls = data.urls;
  if (data.capabilities) capabilities = data.capabilities;
  $('#userName').textContent = currentUser.fullName;
  $('#userRole').textContent = currentUser.role === 'admin' ? 'Administrador' : 'Asesor';
  renderSidebarNav();

  $('#logoutBtn').innerHTML = `${icon('logout', 15)}<span>Cerrar sesión</span>`;
  $('#logoutBtn').addEventListener('click', doLogout);

  renderTabBar();
  navigate(location.hash.slice(1) || 'home');
  window.addEventListener('hashchange', () => {
    const route = location.hash.slice(1) || 'home';
    if (route === currentRoute) return; // ya renderizada por navigate() al fijar el hash — evita doble render
    navigate(route);
  });
}

let currentRoute = null;
function navigate(route) {
  currentRoute = route;
  ActionSheet.close();
  setPullToRefresh(null);   // cada pantalla vuelve a registrarse si puede recargarse
  $$('#nav a').forEach(a => a.classList.toggle('active', a.dataset.route === route));
  updateTabBar(route);
  location.hash = route;
  const main = $('#main');
  main.classList.remove('page-enter');
  const render = {
    home: renderHome, turno: renderTurno, recibo: renderRecibo, metricas: renderMetricas,
    conversaciones: renderConversaciones, posgrados: renderPosgrados, registros: renderRegistros,
    'evento-posgrado': renderEventoPosgrado, recordatorios: renderRecordatorios,
    health: renderHealth, usuarios: renderUsuarios, actividad: renderActividad,
  }[route];
  const result = render ? render(main) : (main.innerHTML = '<div class="card">Página no encontrada</div>');
  requestAnimationFrame(() => main.classList.add('page-enter'));
  return result;
}

const AUDIT_AREAS = {

  posgrado: { label: 'Posgrado', color: '#7c3aed', actions: ['seguimiento_evento_actualizado', 'invitacion_evento_enviada'] },

function dateLabelToday() {
  const s = new Date().toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long' });
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function renderTurno(main) {
  main.innerHTML = `

        </div>
        <button type="submit" class="btn btn-primary" id="turnoBtn">Buscar</button>
      </form>

      <div id="turnoAlert"></div>
      <div id="turnoResult"></div>
    </div>
  `;

  $('#turnoForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const codigo = $('#codigo').value.trim().toUpperCase();
    const btn = $('#turnoBtn');
    haptic(10);
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Buscando…';
    $('#turnoAlert').innerHTML = '';
    $('#turnoResult').innerHTML = `
      <div class="result-block turno-skeleton-block" aria-hidden="true">
        ${Array.from({ length: 5 }).map(() => `
          <div class="row"><span class="skeleton skeleton-line" style="width:72px;height:11px;"></span><span class="skeleton skeleton-line" style="width:118px;height:12px;"></span></div>
        `).join('')}
      </div>`;
    try {
      const r = await api(`/api/tools/turno/${encodeURIComponent(codigo)}`);
      if (!r.ok) {
        const err = await r.json();
        $('#turnoResult').innerHTML = '';
        const msg = err.error === 'no_encontrado' ? `No se encontró información para <strong>${escapeHtml(codigo)}</strong>. Verifica el código e intenta de nuevo.` :
                    err.error === 'codigo_invalido' ? 'Formato de código inválido. Usa T seguido de 8 dígitos (ej. T00012345).' : 'No se pudo consultar el turno. Intenta de nuevo en unos segundos.';
        const tone = err.error === 'no_encontrado' ? 'alert-info' : 'alert-error';
        const ic = err.error === 'no_encontrado' ? icon('search', 16) : icon('x', 16);
        $('#turnoAlert').innerHTML = `<div class="alert ${tone} turno-alert"><span class="turno-alert-icon">${ic}</span><span>${msg}</span></div>`;
        haptic([20, 30, 20]);
        return;
      }
      const { turno } = await r.json();
      const fields = [
        ['Estudiante', `${turno.nombre} ${turno.apellido}`],
        ['Programa', turno.programa],
        ['Turno', turno.turno],
        ['Fecha', turno.fecha],
        ['Hora', turno.hora],
      ];
      $('#turnoResult').innerHTML = `
        <div class="result-block turno-result">
          <div class="turno-result-head"><span class="turno-result-dot"></span> Resultado para ${escapeHtml(codigo)}</div>
          ${fields.map(([label, value]) => `<div class="row" data-copy-row><span class="label">${escapeHtml(label)}</span><span class="value">${escapeHtml(value) || '—'}</span></div>`).join('')}
        </div>
        <p class="turno-hint">Mantén presionado un dato para copiarlo</p>
      `;
      $$('#turnoResult [data-copy-row]').forEach(row => {
        const label = row.querySelector('.label').textContent;
        const value = row.querySelector('.value').textContent;
        if (!value || value === '—') return;
        contextSheet(row, { title: label, subtitle: value, actions: [{ label: `Copiar "${value}"`, icon: '📋', onClick: () => copyToClipboard(value, `${label} copiado`) }] });
      });
      haptic([15, 40, 15]);
    } catch {
      $('#turnoResult').innerHTML = '';
      $('#turnoAlert').innerHTML = `<div class="alert alert-error turno-alert"><span class="turno-alert-icon">${icon('x', 16)}</span><span>Error de conexión. Revisa tu internet e intenta de nuevo.</span></div>`;
      haptic([20, 30, 20]);
    } finally {
      btn.disabled = false; btn.textContent = 'Buscar';
    }
  });
}

function renderRecibo(main) {
  main.innerHTML = `
    <div class="page-header">
      <div><h1>🧾 Descargar recibo de matrícula</h1><div class="subtitle">Tooli ingresa al portal Iceberg con las credenciales del estudiante y descarga el recibo.</div></div>
    </div>

      <form id="reciboForm">
        <div class="field">
          <label>Código estudiantil</label>
          <input type="text" id="rCodigo" placeholder="T00012345" required>
        </div>
        <div class="field">
          <label>Cédula</label>
          <input type="text" id="rCedula" placeholder="1001234567" required>
          <div class="field-help">Solo dígitos, sin puntos ni guiones</div>
        </div>
        <button type="submit" class="btn btn-primary" id="reciboBtn">Descargar PDF</button>
      </form>

      <div id="reciboAlert"></div>
      <div id="reciboResult"></div>
    </div>
  `;

  $('#reciboForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const codigo = $('#rCodigo').value.trim().toUpperCase();
    const cedula = $('#rCedula').value.trim();
    const btn = $('#reciboBtn');
    haptic(10);
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Descargando…';
    $('#reciboAlert').innerHTML = `
      <div class="alert alert-info recibo-loading">
        ${buildProgressRing('reciboProgress')}
        <div class="recibo-loading-text">
          <div class="recibo-loading-title">Ingresando al portal Iceberg…</div>
          <div class="recibo-loading-sub">Puede tardar hasta un minuto. No cierres esta pestaña.</div>
        </div>
      </div>`;
    $('#reciboResult').innerHTML = '';
    let pct = 4;
    setProgress('reciboProgress', pct);
    const progTimer = setInterval(() => {
      pct = Math.min(92, pct + (Math.random() * 5 + 1));
      setProgress('reciboProgress', pct);
    }, 500);
    try {
      const res = await fetch('/api/tools/recibo', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ codigo, cedula }),
      });
      clearInterval(progTimer);
      if (res.status === 401) { window.location.href = '/app/login.html'; return; }
      const ct = res.headers.get('content-type') || '';
      if (ct.includes('application/pdf')) {
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `recibo-${codigo}.pdf`; a.click();
        URL.revokeObjectURL(url);
        setProgress('reciboProgress', 100);
        haptic([15, 40, 15]);
        $('#reciboAlert').innerHTML = `<div class="alert alert-success recibo-success">${successCheckSvg()}<div class="recibo-success-title">PDF descargado correctamente</div><div class="recibo-success-sub">Se guardó como recibo-${escapeHtml(codigo)}.pdf</div></div>`;
        $('#reciboResult').innerHTML = `
          <div class="result-block recibo-result">
            <div class="row" data-copy-row data-copy-label="Código"><span class="label">Código</span><span class="value">${escapeHtml(codigo)}</span></div>
            <div class="row" data-copy-row data-copy-label="Archivo"><span class="label">Archivo</span><span class="value">recibo-${escapeHtml(codigo)}.pdf</span></div>
          </div>
          <p class="turno-hint">Mantén presionado un dato para copiarlo</p>`;
        $$('#reciboResult [data-copy-row]').forEach(row => {
          const label = row.dataset.copyLabel || row.querySelector('.label').textContent;
          const value = row.querySelector('.value').textContent;
          contextSheet(row, { title: label, subtitle: value, actions: [{ label: `Copiar "${value}"`, icon: '📋', onClick: () => copyToClipboard(value, `${label} copiado`) }] });
        });
      } else {
        const err = await res.json();
        let msg = '';
        let tone = 'alert-error';
        let ic = icon('x', 16);
        if (err.noRecibos) {
          tone = 'alert-info';
          ic = icon('search', 16);
          msg = err.nombre ? `No hay recibos pendientes para <strong data-copy-nombre>${escapeHtml(err.nombre)}</strong>.` : 'No hay recibos pendientes para este estudiante.';
        } else if (err.error === 'login_failed') {
          msg = 'Las credenciales no son válidas. Verifica el código y la cédula.';
        } else if (err.error === 'codigo_invalido') {
          msg = 'Formato de código inválido. Usa T seguido de 8 dígitos.';
        } else if (err.error === 'cedula_invalida') {
          msg = 'Formato de cédula inválido. Solo dígitos, sin puntos ni guiones.';
        } else {
          msg = err.detail ? escapeHtml(err.detail) : 'No se pudo descargar el recibo. Intenta de nuevo en unos segundos.';
        }
        haptic([20, 30, 20]);
        $('#reciboAlert').innerHTML = `<div class="alert ${tone} turno-alert"><span class="turno-alert-icon">${ic}</span><span>${msg}</span></div>`;
        if (err.noRecibos && err.nombre) {
          const nombreEl = $('#reciboAlert [data-copy-nombre]');
          if (nombreEl) contextSheet(nombreEl, { title: 'Estudiante', subtitle: err.nombre, actions: [{ label: `Copiar "${err.nombre}"`, icon: '📋', onClick: () => copyToClipboard(err.nombre, 'Nombre copiado') }] });
        }
      }
    } catch {
      clearInterval(progTimer);
      haptic([20, 30, 20]);
      $('#reciboAlert').innerHTML = `<div class="alert alert-error turno-alert"><span class="turno-alert-icon">${icon('x', 16)}</span><span>Error de conexión. Revisa tu internet e intenta de nuevo.</span></div>`;
    } finally {
      btn.disabled = false; btn.textContent = 'Descargar PDF';
    }
  });
}

let metricsCharts = [];
function destroyMetricsCharts() { metricsCharts.forEach(c => c.destroy()); metricsCharts = []; }

async function renderMetricas(main) {
  destroyMetricsCharts();
  main.innerHTML = `
    <div class="page-header">
      <div><h1>📊 Métricas del bot</h1><div class="subtitle">Actividad general de Tooli — no solo posgrados</div></div>
      <div id="metRangeWrap"></div>
    </div>
    <div id="metricsContent">
      <div class="stats-grid stagger-in" style="margin-bottom:16px;">
        ${Array.from({ length: 4 }).map(() => `<div class="stat-card"><div class="skeleton skeleton-line" style="width:70px;height:11px;margin-bottom:8px;"></div><div class="skeleton skeleton-line" style="width:50px;height:26px;"></div></div>`).join('')}
      </div>
      <div class="card" style="margin-bottom:16px;"><div class="skeleton" style="height:220px;border-radius:12px;"></div></div>
      <div class="widget-card"><div class="widget-card-head"><h3>Eventos por tipo</h3></div>
        ${Array.from({ length: 6 }).map(() => `<div class="skeleton skeleton-line" style="height:13px;margin:14px 20px;"></div>`).join('')}
      </div>
    </div>
  `;

  let metDays = '7';
  $('#metRangeWrap').appendChild(buildSegmented(
    [{ value: '7', label: '7 días' }, { value: '14', label: '14 días' }, { value: '30', label: '30 días' }],
    metDays,
    (value) => { metDays = value; loadMetrics(); },
  ));

  setPullToRefresh(() => loadMetrics());
  async function loadMetrics() {
    destroyMetricsCharts();
    try {
      const r = await api(`/api/tools/metrics/range?days=${metDays}`);
      const { days } = await r.json();
      const dateKeys = Object.keys(days).sort();
      const numv = (obj, k) => parseInt(obj?.[k] ?? '0') || 0;

      const totals = {};
      for (const day of Object.values(days)) {
        for (const [k, v] of Object.entries(day)) {
          if (k.includes(':')) continue;
          totals[k] = (totals[k] ?? 0) + (parseInt(v) || 0);
        }
      }
      const rows = Object.entries(totals).sort((a, b) => b[1] - a[1]);
      const maxVal = Math.max(1, ...rows.map(([, v]) => v));

      const totalMsgs = numv({ ...totals }, 'menu_shown') + (totals.ai_request ?? 0) + (totals.turno_consultado ?? 0) + (totals.recibo_descargado ?? 0);

      $('#metricsContent').innerHTML = `
        <div class="stats-grid stagger-in" style="margin-bottom:16px;">
          <div class="stat-card"><div class="label">Mensajes totales</div><div class="value">${totalMsgs}</div></div>
          <div class="stat-card"><div class="label">Preguntas IA</div><div class="value">${totals.ai_request ?? 0}</div></div>
          <div class="stat-card"><div class="label">Prospectos</div><div class="value">${totals.prospecto_completado ?? 0}</div></div>
          <div class="stat-card"><div class="label">Casos a asesor</div><div class="value">${totals.agent_handoff ?? 0}</div></div>
        </div>

        <div class="card" style="margin-bottom:16px;">
          <h3 style="font-size:13px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:16px;">Tendencia diaria</h3>
          <div style="position:relative;height:240px;"><canvas id="metChartDaily"></canvas></div>
        </div>

        <div class="widget-card">
          <div class="widget-card-head"><h3>Eventos por tipo</h3></div>
          <div class="event-bars">
            ${rows.length === 0 ? `<p style="color:var(--text-muted);text-align:center;padding:24px 0;">Sin actividad registrada en este rango.</p>` : rows.map(([k, v]) => {
              const meta = eventMeta(k);
              const pct = Math.max(4, Math.round(v / maxVal * 100));
              return `
                <div class="event-bar-row">
                  <span class="event-bar-icon">${meta.icon}</span>
                  <div class="event-bar-body">
                    <div class="event-bar-top"><span class="event-bar-label">${escapeHtml(meta.label)}</span><span class="event-bar-value">${v}</span></div>
                    <div class="event-bar-track"><div class="event-bar-fill" style="width:${pct}%;background:${meta.color};"></div></div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>

        <p style="margin-top:16px;font-size:13px;color:var(--text-muted);">
          Para métricas técnicas (latencia, errores, uso de recursos), abre <a href="${publicUrls.grafana}" target="_blank">Grafana</a>.
        </p>
      `;

      await loadScript('https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js');
      const topKeys = rows.slice(0, 4).map(([k]) => k);
      const ticks = { color: '#94a3b8' };
      const grid = { color: '#e2e8f0' };
      metricsCharts.push(new Chart(document.getElementById('metChartDaily'), {
        type: 'line',
        data: {
          labels: dateKeys.map(d => d.slice(5)),
          datasets: topKeys.map(k => ({
            label: eventMeta(k).label,
            data: dateKeys.map(d => numv(days[d], k)),
            borderColor: eventMeta(k).color, backgroundColor: eventMeta(k).color + '33',
            tension: 0.3, fill: true,
          })),
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { labels: { color: '#64748b' } } },
          scales: { x: { ticks, grid }, y: { ticks, grid, beginAtZero: true } },
        },
      }));
    } catch (err) {
      console.error(err);
      $('#metricsContent').innerHTML = '<div class="alert alert-error">No se pudieron cargar las métricas.</div>';
    }
  }

  loadMetrics();
}

      contextSheet(card, { title: u.fullName, subtitle: username, actions });

const AVATAR_TONES = ['#0284c7', '#7c3aed', '#059669', '#d97706', '#db2777', '#0d9488'];
function avatarTone(seed) {
  let h = 0;
  for (const ch of String(seed)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return AVATAR_TONES[h % AVATAR_TONES.length];
}
function initialsFor(phone, nombre) {
  if (nombre) return nombre.trim().split(/\s+/).slice(0, 2).map(s => s[0]).join('').toUpperCase();
  return String(phone).slice(-2);
}
function relativeTime(ts) {
  const diff = Date.now() - ts;
  const min = Math.round(diff / 60000);
  if (min < 1) return 'ahora';
  if (min < 60) return `${min} min`;
  const hr = Math.round(min / 60);
  if (hr < 24) return `${hr} h`;
  const days = Math.round(hr / 24);
  if (days < 7) return `${days} d`;
  return new Date(ts).toLocaleDateString('es-CO', { day: '2-digit', month: 'short' });
}
function friendlyDate(raw) {
  if (!raw) return '';
  const d = new Date(raw);
  if (isNaN(d.getTime())) return raw;
  return d.toLocaleDateString('es-CO', { day: '2-digit', month: 'short', year: 'numeric' }) +
    ' · ' + d.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
}

let conversationsCache = [];
let inboxFilter = 'todos';

/* Categoriza la conversación según el paso de flujo real (no es un campo
   inventado: son los mismos nombres de `step` que usan los flujos en
   src/flows — programas/registro/prospecto son de posgrado, turno/recibo
   son de pregrado/matrícula). Si no hay sesión activa, queda "Sin flujo". */
const FLOW_CATEGORIES = {
  posgrado: { label: 'Posgrado', color: '#7c3aed', prefixes: ['menu_posgrado', 'programas_', 'registro_', 'prospecto_'] },
  pregrado: { label: 'Pregrado', color: '#0284c7', prefixes: ['menu_pregrado', 'pregrado_', 'esperando_codigo', 'recibo_'] },
  evento: { label: 'Evento', color: '#db2777', prefixes: ['evento_'] },
  soporte: { label: 'Soporte', color: '#64748b', prefixes: ['agent_', 'ti_', 'with_agent', 'chatting_with_ai'] },
};
function flowCategory(step) {
  if (!step || step === 'menu') return null;
  for (const [key, cat] of Object.entries(FLOW_CATEGORIES)) {
    if (cat.prefixes.some(p => step.startsWith(p))) return { key, ...cat };
  }
  return null;
}

/* Swipe-to-reveal (patrón Mail/iOS): arrastra la fila para revelar acciones */
function attachSwipeRow(row) {
  const content = row.querySelector('.swipe-content');
  const actionsEl = row.querySelector('.swipe-actions');
  const REVEAL = Math.ceil(actionsEl?.getBoundingClientRect().width || 140);
  let startX = 0, startY = 0, dx = 0, dragging = false, decided = false, isHorizontal = false;

  const closeAllOthers = () => $$('.swipe-row.swiped').forEach(r => { if (r !== row) { r.classList.remove('swiped'); r.style.setProperty('--swipe-x', '0px'); } });

  row.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse') return;
    startX = e.clientX; startY = e.clientY; dx = 0; dragging = true; decided = false; isHorizontal = false;
    content.style.transition = 'none';
  });
  row.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const rawDx = e.clientX - startX;
    const rawDy = e.clientY - startY;
    if (!decided) {
      if (Math.abs(rawDx) > 8 || Math.abs(rawDy) > 8) { decided = true; isHorizontal = Math.abs(rawDx) > Math.abs(rawDy); }
      else return;
    }
    if (!isHorizontal) { dragging = false; return; }
    e.preventDefault();
    const base = row.classList.contains('swiped') ? -REVEAL : 0;
    dx = Math.min(0, Math.max(-REVEAL - 24, base + rawDx));
    content.style.transform = `translateX(${dx}px)`;
  });
  const finish = () => {
    if (!dragging) return;
    dragging = false;
    content.style.transition = '';
    content.style.transform = '';
    if (dx < -REVEAL / 2) { row.classList.add('swiped'); row.style.setProperty('--swipe-x', `-${REVEAL}px`); haptic(10); closeAllOthers(); }
    else { row.classList.remove('swiped'); row.style.setProperty('--swipe-x', '0px'); }
  };
  row.addEventListener('pointerup', finish);
  row.addEventListener('pointercancel', finish);
  content.querySelector('.inbox-row').addEventListener('click', (e) => {
    if (row.classList.contains('swiped')) { e.preventDefault(); e.stopImmediatePropagation(); row.classList.remove('swiped'); row.style.setProperty('--swipe-x', '0px'); }
  }, { capture: true });
}

/* Marcado de WhatsApp para la vista previa: *negrita*, _cursiva_, ~tachado~ y
   ```monoespaciado```. Se aplica SIEMPRE sobre texto ya escapado — nunca sobre
   texto crudo — así el formato no abre una vía de inyección de HTML. */
function formatWhatsApp(textoEscapado) {
  return textoEscapado
    .replace(/```([\s\S]+?)```/g, '<code>$1</code>')
    .replace(/(^|\s)\*(\S[^*]*?)\*(?=$|\s|[.,!?])/g, '$1<strong>$2</strong>')
    .replace(/(^|\s)_(\S[^_]*?)_(?=$|\s|[.,!?])/g, '$1<em>$2</em>')
    .replace(/(^|\s)~(\S[^~]*?)~(?=$|\s|[.,!?])/g, '$1<s>$2</s>')
    .replace(/\n/g, '<br>');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

/* Ficha del prospecto desde la bandeja — el mismo componente que usa el CRM,

/* Respuestas rápidas: plantillas compartidas del equipo. El placeholder
   {nombre} se reemplaza acá con el nombre real que capturó el bot — nunca se
   inserta el literal "{nombre}" en un mensaje que va a un estudiante. */
let quickRepliesCache = null;

function aplicarPlaceholders(texto, nombre) {
  const primerNombre = (nombre ?? '').trim().split(/\s+/)[0];
  return texto.replace(/\{nombre\}/g, primerNombre || 'hola');
}

async function abrirRespuestasRapidas(input, sync, nombre) {
  haptic(10);
  if (!quickRepliesCache) {
    try {
      quickRepliesCache = (await (await api('/api/tools/quick-replies')).json()).replies ?? [];
    } catch {
      toast('No se pudieron cargar las respuestas rápidas');
      return;
    }
  }

  const insertar = (texto) => {
    const final = aplicarPlaceholders(texto, nombre);
    // Se inserta en el cursor y NO se envía: el asesor siempre revisa antes.
    const pos = input.selectionStart ?? input.value.length;
    input.value = input.value.slice(0, pos) + final + input.value.slice(pos);
    input.focus();
    input.setSelectionRange(pos + final.length, pos + final.length);
    sync();
    haptic(12);
  };

  const guardarActual = async () => {
    const texto = input.value.trim();
    if (!texto) { toast('Escribe primero el mensaje que quieres guardar'); return; }
    const titulo = texto.split('\n')[0].slice(0, 48);
    try {
      const r = await api('/api/tools/quick-replies', { method: 'POST', body: JSON.stringify({ titulo, texto }) });
      const data = await r.json();
      if (!r.ok) { toast(data.message ?? 'No se pudo guardar'); return; }
      quickRepliesCache = null;
      toast('Guardada como respuesta rápida');
      haptic([10, 20, 10]);
    } catch { toast('No se pudo guardar'); }
  };

  const grupos = [];
  if (quickRepliesCache.length) {
    grupos.push(quickRepliesCache.slice(0, 10).map(q => ({
      label: q.titulo,
      icon: icon('bolt', 15),
      onClick: () => insertar(q.texto),
    })));
  }
  grupos.push([{ label: 'Guardar el mensaje actual', icon: icon('plus', 15), onClick: guardarActual }]);
  grupos.push([{ label: 'Cancelar', cancel: true }]);

  ActionSheet.open({
    title: 'Respuestas rápidas',
    subtitle: quickRepliesCache.length
      ? 'Se inserta en el mensaje para que la revises antes de enviar.'
      : 'Aún no hay ninguna. Escribe un mensaje y guárdalo para reutilizarlo.',
    groups: grupos,
  });
}

/* Composer de la bandeja: responder por WhatsApp sin salir del panel.
   El backend valida la ventana de 24h de Meta y devuelve 409 con el motivo. */
function setupComposer(phone, nombre) {
  const form = $('#composer');
  if (!form) return;
  const input = $('#composerInput');
  const sendBtn = $('#composerSend');
  const hint = $('#composerHint');
  const msgsEl = $('#inboxMessages');

  const autoGrow = () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  };
  const sync = () => {
    sendBtn.disabled = input.value.trim().length === 0;
    autoGrow();
  };
  input.addEventListener('input', sync);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });

  $('#composerQuick')?.addEventListener('click', () => abrirRespuestasRapidas(input, sync, nombre));

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const texto = input.value.trim();
    if (!texto) return;

    // Burbuja optimista: el mensaje aparece al instante y se marca "enviando".
    const row = document.createElement('div');
    row.className = 'bubble-row out group-start sending';
    row.innerHTML = `<div class="bubble out">${escapeHtml(texto)}<span class="bubble-time">enviando…</span></div>`;
    msgsEl?.appendChild(row);
    msgsEl?.scrollTo({ top: msgsEl.scrollHeight, behavior: 'smooth' });

    input.value = '';
    sync();
    input.disabled = true;
    sendBtn.disabled = true;
    haptic(12);

    try {
      const r = await api(`/api/tools/bot-users/${phone}/reply`, { method: 'POST', body: JSON.stringify({ text: texto }) });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) {
        row.remove();
        input.value = texto;   // no perder lo que escribió
        haptic([20, 30, 20]);
        if (data.error === 'fuera_de_ventana') {
          hint.innerHTML = `<span class="composer-warn">${icon('clock', 13)} ${escapeHtml(data.message ?? '')}</span>`;
        } else {
          hint.innerHTML = `<span class="composer-warn">${icon('x', 13)} No se pudo enviar: ${escapeHtml(data.message ?? 'error desconocido')}</span>`;
        }
        return;
      }
      row.classList.remove('sending');
      row.querySelector('.bubble-time').textContent = new Date().toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
      hint.textContent = 'Enter envía · Shift+Enter salta de línea';
      haptic([10, 20, 10]);
    } catch {
      row.remove();
      input.value = texto;
      hint.innerHTML = `<span class="composer-warn">${icon('x', 13)} Sin conexión con el servidor.</span>`;
      haptic([20, 30, 20]);
    } finally {
      input.disabled = false;
      sync();
      input.focus();
    }
  });
}

function groupMessages(msgs) {
  const GROUP_MS = 3 * 60 * 1000;
  const groups = [];
  msgs.forEach((m, i) => {
    const prev = msgs[i - 1];
    const sameGroup = prev && prev.direction === m.direction && (m.ts - prev.ts) < GROUP_MS;
    if (sameGroup) groups[groups.length - 1].push(m); else groups.push([m]);
  });
  return groups;
}

async function previewPhoneFor(phone) {
  try {
    const r = await api(`/api/tools/bot-users/${phone}`);
    const info = await r.json();
    const nombre = info.session?.data?.nombre;
    const msgs = [...info.recentMessages].reverse();
    openPhonePreview(phone, nombre, groupMessages(msgs));
  } catch {
    toast('No se pudo cargar la conversación');
  }
}

      ${rows.length ? `<div class="profile-sheet-rows">${rows.map(r => `<div class="profile-sheet-row"><span class="profile-sheet-row-icon">${r.icon ?? ''}</span><span class="profile-sheet-row-label">${escapeHtml(r.label)}</span><span class="profile-sheet-row-value">${escapeHtml(String(r.value ?? '—'))}</span></div>`).join('')}</div>` : ''}
      ${extraHtml}

    </div>
  `;
  document.body.appendChild(overlay);

    overlay.classList.remove('open');

    document.removeEventListener('keydown', onKey);

  actions.forEach((a, i) => overlay.querySelector(`[data-pa="${i}"]`)?.addEventListener('click', () => {
    a.onClick?.();
    if (a.closeAfter !== false) close();
  }));
  onMount?.(overlay.querySelector('.profile-sheet'), { close });
  return { close };
}

            <div class="wa-bubble-row ${m.direction === 'out' ? 'me' : 'them'}">

                ${formatWhatsApp(escapeHtml(m.text))}
                <span class="wa-bubble-meta">${new Date(m.ts).toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' })}${m.direction === 'out' ? ' <span class=\"wa-ticks\">✓✓</span>' : ''}</span>

}

let pgCharts = [];

function destroyPgCharts() {
  pgCharts.forEach(c => c.destroy());
  pgCharts = [];
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    if (document.querySelector(`script[src="${src}"]`)) { resolve(); return; }
    const s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}

    [{ value: '7', label: '7 días' }, { value: '14', label: '14 días' }, { value: '30', label: '30 días' }],
    pgDays,
    (value) => { pgDays = value; loadPg(); },

  function pgSkeleton() {
    return `
      <div class="stats-grid" style="margin-bottom:20px;">
        ${Array.from({ length: 5 }).map(() => `<div class="stat-card"><div class="skeleton skeleton-line" style="width:70px;height:11px;margin-bottom:8px;"></div><div class="skeleton skeleton-line" style="width:50px;height:26px;"></div></div>`).join('')}

          </div>
          <div class="stat-card">
            <div class="label">Especializaciones</div>
            <div class="value">${especs}</div>
          </div>
          <div class="stat-card">
            <div class="label">Maestrías</div>
            <div class="value">${maestrias}</div>
          </div>

            <div class="label">Doctorados</div>
            <div class="value">${doctorados}</div>

        <div class="card" style="margin-bottom:16px;">
          <h3 style="font-size:13px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:16px;">Actividad diaria — posgrados</h3>
          <div style="position:relative;height:240px;"><canvas id="pgChartDaily"></canvas></div>
        </div>

        <div class="posgrados-split" style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;">
          <div class="card">

          </div>
        </div>
      `;

      await loadScript('https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js');

      const ticks = { color: '#94a3b8' };
      const grid  = { color: '#e2e8f0' };
      const base  = {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { labels: { color: '#64748b' } } },
        scales: { x: { ticks, grid }, y: { ticks, grid, beginAtZero: true } },
      };

      pgCharts.push(new Chart(document.getElementById('pgChartDaily'), {
        type: 'line',
        data: {
          labels: dateKeys.map(fmtDay),
          datasets: [
            { label: 'Prosp. iniciados',  data: daily('prospecto_iniciado'),   borderColor: '#38bdf8', backgroundColor: '#38bdf833', tension: 0.3, fill: true },
            { label: 'Prosp. completados',data: daily('prospecto_completado'), borderColor: '#22c55e', backgroundColor: '#22c55e33', tension: 0.3, fill: true },
            { label: 'Registros BD',      data: daily('registro_completado'),  borderColor: '#a855f7', backgroundColor: '#a855f733', tension: 0.3, fill: true },
          ],
        },
        options: base,
      }));

      pgCharts.push(new Chart(document.getElementById('pgChartProgramas'), {
        type: 'doughnut',
        data: {
          labels: ['Especializaciones', 'Maestrías', 'Doctorados'],
          datasets: [{ data: [especs, maestrias, doctorados], backgroundColor: ['#38bdf8', '#a855f7', '#ec4899'] }],
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#64748b' } } } },
      }));

      pgCharts.push(new Chart(document.getElementById('pgChartFunnel'), {
        type: 'bar',
        data: {
          labels: ['Prosp. iniciados', 'Prosp. completados', 'Reg. iniciados', 'Reg. completados'],
          datasets: [{
            data: [prospInicio, prospectos, regInicio, registros],
            backgroundColor: ['#38bdf8', '#22c55e', '#eab308', '#a855f7'],
          }],
        },
        options: { ...base, plugins: { legend: { display: false } } },
      }));

    } catch (err) {
      console.error(err);
      $('#pgContent').innerHTML = '<div class="alert alert-error">No se pudieron cargar las métricas de posgrados.</div>';
    }
  }

  loadPg();
}

/* ============= REGISTROS BD (CRM de prospectos) ============= */
/* Exportar el CRM a CSV — lo que un coordinador necesita para cruzar datos en
   Excel o pasarle la lista a alguien que no entra al panel. Exporta lo que se
   está viendo (filtros y búsqueda aplicados), no toda la base, para que el
   archivo coincida con lo que la persona tiene en pantalla. */
function csvEscape(v) {
  const t = String(v ?? '');
  return /[",\n;]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t;
}

function exportarCrmCsv() {
  const q = ($('#crmSearch')?.value ?? '').trim().toLowerCase();
  const filas = crmRows.filter((row) => {
    if (crmFilter !== 'todos' && crmCategoria(row) !== crmFilter) return false;
    if (crmEtapa !== 'todas' && (crmFichas[row[3]]?.estado ?? 'nuevo') !== crmEtapa) return false;
    if (crmSoloMios && crmFichas[row[3]]?.asignadoA !== currentUser?.username) return false;
    if (!q) return true;
    return [row[1], row[2], row[4]].some(v => (v ?? '').toLowerCase().includes(q));
  });

  if (!filas.length) { toast('No hay nada que exportar con estos filtros'); haptic([20, 30, 20]); return; }

  const cabecera = ['Fecha de registro', 'Nombre', 'Correo', 'WhatsApp', 'Programa de interés', 'Área', 'Etapa', 'Asesor', 'Etiquetas', 'Notas'];
  const lineas = [cabecera.join(';')];
  filas.forEach((row) => {
    const f = crmFichas[row[3]];
    // Fecha en "YYYY-MM-DD HH:mm": Excel la reconoce y además ordena bien,
    // cosa que el ISO crudo con la T y la Z no hace en configuración española.
    const d = new Date(row[0]);
    const fecha = Number.isNaN(d.getTime())
      ? row[0]
      : `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    lineas.push([
      fecha, row[1], row[2], row[3], row[4], areaOf(row),
      crmEstadoMeta(f?.estado ?? 'nuevo').label,
      f?.asignadoA ?? '',
      (f?.etiquetas ?? []).join(', '),
      f?.notas?.length ?? 0,
    ].map(csvEscape).join(';'));
  });

  // BOM para que Excel en Windows abra bien las tildes, y ";" como separador
  // porque es lo que espera Excel en configuración regional de Colombia.
  const blob = new Blob(['﻿' + lineas.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `prospectos-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  haptic([10, 20, 10]);
  toast(`${filas.length} prospecto${filas.length === 1 ? '' : 's'} exportado${filas.length === 1 ? '' : 's'}`);
}

/* ============= FICHA DE SEGUIMIENTO DEL CRM =============
   Notas, estado del embudo, etiquetas y asignación por prospecto.
   Todo esto lo escribe el equipo — no viene del bot ni de un sistema
   universitario, y la UI lo deja claro (ver src/services/crmService.ts). */
const CRM_ESTADOS = [

  { value: 'contactado',  label: 'Contactado',  icon: '📞', color: '#0284c7' },

];
function crmEstadoMeta(valor) {

function notaHtml(n) {

/** Conecta los controles de la ficha. `onChange` refresca la grilla de atrás. */
function wireFicha(sheet, phone, ficha, onChange) {
  let f = ficha ?? { estado: 'nuevo', etiquetas: [], notas: [] };
  const $$$ = (sel) => sheet.querySelector(sel);

  const guardar = async (ruta, body) => {
    try {
      const r = await api(`/api/tools/crm/${phone}/${ruta}`, { method: 'POST', body: JSON.stringify(body) });
      const data = await r.json();
      if (!r.ok) throw new Error(data.message ?? 'error');
      f = data.ficha;
      onChange?.();
      return true;
    } catch (err) {
      toast('No se pudo guardar');
      haptic([20, 30, 20]);
      return false;
    }
  };

  // Estado del embudo
  $$$('#fichaEstados')?.addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-estado]');
    if (!btn || btn.classList.contains('active')) return;
    haptic(12);
    const estado = btn.dataset.estado;
    if (!(await guardar('estado', { estado }))) return;
    $$$('#fichaEstados').querySelectorAll('.crm-estado-chip').forEach(b => b.classList.toggle('active', b === btn));
    const meta = crmEstadoMeta(estado);
    const actual = $$$('#fichaEstadoActual');
    actual.textContent = `${meta.icon} ${meta.label}`;
    actual.style.color = meta.color;
    toast(`Marcado como ${meta.label.toLowerCase()}`);
  });

  // Asignación
  $$$('#fichaAsignarBtn')?.addEventListener('click', async (e) => {
    haptic(12);
    const mio = f.asignadoA === currentUser?.username;
    if (!(await guardar('asignar', { username: mio ? null : currentUser?.username }))) return;
    $$$('#fichaAsignado').textContent = f.asignadoA ? f.asignadoA : 'Sin asignar';
    e.target.textContent = f.asignadoA === currentUser?.username ? 'Liberar' : 'Tomar';
    toast(f.asignadoA ? 'Prospecto asignado a ti' : 'Prospecto liberado');
  });

  // Etiquetas
  const pintarEtiquetas = () => {
    const cont = $$$('#fichaEtiquetas');
    const input = $$$('#fichaEtiquetaInput');
    cont.querySelectorAll('.crm-etiqueta').forEach(el => el.remove());
    f.etiquetas.forEach(et => {
      const span = document.createElement('span');
      span.className = 'crm-etiqueta';
      span.innerHTML = `${escapeHtml(et)}<button type="button" data-quitar="${escapeHtml(et)}" aria-label="Quitar etiqueta">${icon('x', 11)}</button>`;
      cont.insertBefore(span, input);
    });
  };
  $$$('#fichaEtiquetaInput')?.addEventListener('keydown', async (e) => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const valor = e.target.value.trim();
    if (!valor || f.etiquetas.includes(valor)) { e.target.value = ''; return; }
    haptic(10);
    if (!(await guardar('etiquetas', { etiquetas: [...f.etiquetas, valor] }))) return;
    e.target.value = '';
    pintarEtiquetas();
  });
  $$$('#fichaEtiquetas')?.addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-quitar]');
    if (!btn) return;
    haptic(10);
    if (!(await guardar('etiquetas', { etiquetas: f.etiquetas.filter(x => x !== btn.dataset.quitar) }))) return;
    pintarEtiquetas();
  });

  // Notas
  const notaInput = $$$('#fichaNotaInput');
  const notaBtn = $$$('#fichaNotaBtn');
  notaInput?.addEventListener('input', () => { notaBtn.disabled = !notaInput.value.trim(); });
  $$$('#fichaNotaForm')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const texto = notaInput.value.trim();
    if (!texto) return;
    notaBtn.disabled = true;
    haptic(12);
    if (!(await guardar('nota', { texto }))) { notaBtn.disabled = false; return; }
    notaInput.value = '';
    const lista = $$$('#fichaNotas');
    lista.querySelector('.crm-notas-vacio')?.remove();
    lista.insertAdjacentHTML('afterbegin', notaHtml(f.notas[0]));
    lista.firstElementChild.classList.add('recien-agregada');
    $$$('#fichaNotasCount').textContent = f.notas.length;
    toast('Nota guardada');
  });
  $$$('#fichaNotas')?.addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-del]');
    if (!btn) return;
    haptic([15, 20, 15]);
    const id = btn.dataset.del;
    try {
      const r = await api(`/api/tools/crm/${phone}/nota/${id}`, { method: 'DELETE' });
      const data = await r.json();
      if (!r.ok) throw new Error();
      f = data.ficha ?? f;
      const li = $$$(`[data-nota="${id}"]`);
      li?.classList.add('saliendo');
      setTimeout(() => li?.remove(), 220);
      $$$('#fichaNotasCount').textContent = f.notas.length;
      onChange?.();
    } catch { toast('No se pudo eliminar la nota'); }
  });
}

function programaCategoria(programa) {
  const p = (programa || '').toLowerCase();
  if (p.includes('doctorado')) return 'doctorado';
  if (p.includes('maestr')) return 'maestria';
  if (p.includes('especial')) return 'especializacion';
  return 'otro';
}
const PROGRAMA_LABELS = { pregrado: 'Pregrado', especializacion: 'Especialización', maestria: 'Maestría', doctorado: 'Doctorado', otro: 'Otro' };
const PROGRAMA_COLORS = { pregrado: '#0284c7', especializacion: '#0369a1', maestria: '#7c3aed', doctorado: '#db2777', otro: '#64748b' };

   pregrado y posgrado que ahora comparten el mismo registro) — las filas
   guardadas antes de esa columna vienen vacías y se tratan como Posgrado. */
function areaOf(row) { return row[5] || 'Posgrado'; }
function crmCategoria(row) { return areaOf(row) === 'Pregrado' ? 'pregrado' : programaCategoria(row[4]); }
