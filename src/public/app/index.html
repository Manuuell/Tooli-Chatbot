const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

/* ============= Microinteracciones: haptics, toast, action sheet, long-press ============= */
function haptic(pattern) {
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch {}
}

function toast(msg, ms = 2200) {
  const stack = $('#toastStack');
  if (!stack) return;
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  stack.appendChild(el);
  setTimeout(() => {
    el.classList.add('hide');
    setTimeout(() => el.remove(), 260);
  }, ms);
}

function copyToClipboard(text, label = 'Copiado') {
  try {
    navigator.clipboard?.writeText(text);
    toast(`${label} ✓`);
    haptic(15);
  } catch {
    toast('No se pudo copiar');
  }
}

/* Tooltip flotante ("ventana de texto") — hover en desktop, tap en touch */
function attachTooltip(el, text) {
  if (!text) return;
  el.classList.add('tt-anchor');
  const bubble = document.createElement('span');
  bubble.className = 'tt-bubble';
  bubble.textContent = text;
  el.appendChild(bubble);
  const show = () => el.classList.add('tt-visible');
  const hide = () => el.classList.remove('tt-visible');
  el.addEventListener('mouseenter', show);
  el.addEventListener('mouseleave', hide);
  el.addEventListener('touchstart', (e) => { e.stopPropagation(); show(); setTimeout(hide, 1800); }, { passive: true });
}

/* Control segmentado estilo iOS (reemplaza <select> simples) */
function buildSegmented(options, activeValue, onChange) {
  const wrap = document.createElement('div');
  wrap.className = 'segmented';
  const thumb = document.createElement('div');
  thumb.className = 'segmented-thumb';
  wrap.appendChild(thumb);
  const buttons = options.map(opt => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = opt.label;
    btn.dataset.value = opt.value;
    btn.addEventListener('click', () => {
      if (btn.classList.contains('active')) return;
      haptic(10);
      setActive(opt.value);
      onChange(opt.value);
    });
    wrap.appendChild(btn);
    return btn;
  });
  function setActive(value) {
    buttons.forEach(b => b.classList.toggle('active', b.dataset.value === value));
    const activeBtn = buttons.find(b => b.dataset.value === value);
    if (activeBtn) { thumb.style.left = `${activeBtn.offsetLeft}px`; thumb.style.width = `${activeBtn.offsetWidth}px`; }
  }
  requestAnimationFrame(() => setActive(activeValue));
  return wrap;
}

/* Contador animado (ease-out cúbico) para los números de las stat cards */
function countUp(el, to, duration = 650) {
  const from = 0;
  const t0 = performance.now();
  function frame(now) {
    const p = Math.min(1, (now - t0) / duration);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(from + (to - from) * eased);
    if (p < 1) requestAnimationFrame(frame);
    else el.textContent = to;
  }
  requestAnimationFrame(frame);
}

/* Anillo de progreso circular (espera de descarga de recibo) */
const RING_C = 150.8;
function buildProgressRing(id) {
  return `<div class="progress-ring" id="${id}">
    <svg width="56" height="56" viewBox="0 0 56 56">
      <circle class="track" cx="28" cy="28" r="24"></circle>
      <circle class="fill" id="${id}-fill" cx="28" cy="28" r="24" stroke-dasharray="${RING_C}" stroke-dashoffset="${RING_C}"></circle>
    </svg>
    <span class="pct" id="${id}-pct">0%</span>
  </div>`;
}
function setProgress(id, pct) {
  const fill = document.getElementById(`${id}-fill`);
  const label = document.getElementById(`${id}-pct`);
  if (!fill) return;
  fill.style.strokeDashoffset = String(RING_C - (RING_C * pct / 100));
  if (label) label.textContent = `${Math.round(pct)}%`;
}

/* Check de éxito animado (el trazo del SVG se "dibuja" solo) */
function successCheckSvg() {
  return `<svg class="success-check" viewBox="0 0 66 66" xmlns="http://www.w3.org/2000/svg">
    <circle cx="33" cy="33" r="28"></circle>
    <path d="M19 34l10 10 18-19"></path>
  </svg>`;
}

const ActionSheet = {
  _escHandler: null,
  open({ title, subtitle, groups }) {
    this.close();
    haptic(12);
    const backdrop = document.createElement('div');
    backdrop.className = 'sheet-backdrop';
    backdrop.id = 'activeSheet';

    const sheet = document.createElement('div');
    sheet.className = 'action-sheet';

    let html = '<div class="sheet-grabber"></div>';
    if (title) {
      html += `<div class="sheet-header"><div class="sheet-title">${title}</div>${subtitle ? `<div class="sheet-subtitle">${subtitle}</div>` : ''}</div>`;
    }
    const flat = [];
    groups.forEach(group => {
      html += '<div class="sheet-group">' + group.map(a => {
        flat.push(a);
        const cls = [a.destructive ? 'destructive' : '', a.cancel ? 'cancel' : ''].filter(Boolean).join(' ');
        return `<button type="button" class="sheet-action ${cls}">${a.icon ? `<span class="sheet-icon">${a.icon}</span>` : ''}${a.label}</button>`;
      }).join('') + '</div>';
    });
    sheet.innerHTML = html;
    backdrop.appendChild(sheet);
    document.body.appendChild(backdrop);

    $$('.sheet-action', sheet).forEach((btn, i) => btn.addEventListener('click', () => {
      this.close();
      flat[i].onClick && flat[i].onClick();
    }));
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) this.close(); });

    let startY = null;
    sheet.addEventListener('touchstart', e => { startY = e.touches[0].clientY; }, { passive: true });
    sheet.addEventListener('touchmove', e => {
      if (startY == null) return;
      const dy = e.touches[0].clientY - startY;
      if (dy > 0) sheet.style.transform = `translateY(${dy}px)`;
    }, { passive: true });
    sheet.addEventListener('touchend', e => {
      const dy = e.changedTouches[0].clientY - startY;
      sheet.style.transform = '';
      startY = null;
      if (dy > 80) this.close();
    });

    this._escHandler = (e) => { if (e.key === 'Escape') this.close(); };
    document.addEventListener('keydown', this._escHandler);
    requestAnimationFrame(() => backdrop.classList.add('open'));
  },
  close() {
    const el = document.getElementById('activeSheet');
    if (this._escHandler) { document.removeEventListener('keydown', this._escHandler); this._escHandler = null; }
    if (!el) return;
    el.classList.remove('open');
    setTimeout(() => el.remove(), 260);
  },
};

function contextSheet(el, { title, subtitle, actions }) {
  attachLongPress(el, () => {
    ActionSheet.open({
      title, subtitle,
      groups: [actions, [{ label: 'Cancelar', cancel: true }]],
    });
  });
}

function attachLongPress(el, handler, opts = {}) {
  const delay = opts.delay ?? 460;
  let timer = null, moved = false, startX = 0, startY = 0, active = false;
  el.classList.add('longpressable');
  const clear = () => {
    clearTimeout(timer); timer = null;
    if (active) { el.classList.remove('longpress-active'); active = false; }
  };
  el.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    moved = false; startX = e.clientX; startY = e.clientY;
    timer = setTimeout(() => {
      if (moved) return;
      active = true;
      el.classList.add('longpress-active');
      const swallowClick = (ev) => { ev.preventDefault(); ev.stopImmediatePropagation(); };
      el.addEventListener('click', swallowClick, { capture: true, once: true });
      setTimeout(() => el.removeEventListener('click', swallowClick, { capture: true }), 700);
      handler();
    }, delay);
  });
  el.addEventListener('pointermove', (e) => {
    if (Math.abs(e.clientX - startX) > 10 || Math.abs(e.clientY - startY) > 10) { moved = true; clear(); }
  });
  el.addEventListener('pointerup', clear);
  el.addEventListener('pointerleave', clear);
  el.addEventListener('pointercancel', clear);
  el.addEventListener('contextmenu', (e) => e.preventDefault());
}

  trash: '<path d="M4 7h16"/><path d="M6 7V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2"/><path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/><path d="M10 11v6M14 11v6"/>',
  ban: '<circle cx="12" cy="12" r="9"/><path d="m5.5 5.5 13 13"/>',

function icon(name, size = 20) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="icon-svg">${ICONS[name] ?? ''}</svg>`;
}

/* ============= Tab bar móvil ============= */
const TAB_ROUTES = [
  { route: 'home', icon: 'home', label: 'Inicio' },
  { route: 'turno', icon: 'clipboard', label: 'Turno' },
  { route: 'recibo', icon: 'receipt', label: 'Recibo' },
  { route: 'posgrados', icon: 'cap', label: 'Posgrados' },
];
function moreRoutes() {
  const routes = [
    { route: 'metricas', icon: '📊', label: 'Métricas' },
    { route: 'conversaciones', icon: '💬', label: 'Conversaciones' },
    { route: 'registros', icon: '📝', label: 'Registros BD' },
    { route: 'health', icon: '❤️', label: 'Estado del sistema' },
  ];
  if (currentUser?.role === 'admin') {
    routes.push({ route: 'actividad', icon: '📈', label: 'Actividad de asesores' });
    routes.push({ route: 'usuarios', icon: '👥', label: 'Asesores' });
  }
  return routes;
}

function renderTabBar() {
  const bar = $('#tabBar');
  if (!bar) return;
  const tabs = [...TAB_ROUTES, { route: '__more', icon: 'more', label: 'Más' }];
  bar.innerHTML = tabs.map(t => `
    <button type="button" class="tab-item" data-tab="${t.route}">
      <span class="tab-notch"></span>
      <span class="tab-icon">${icon(t.icon, 23)}</span>
      <span class="tab-label">${t.label}</span>
    </button>
  `).join('');
  $$('.tab-item', bar).forEach(btn => btn.addEventListener('click', () => {
    haptic(10);
    if (btn.dataset.tab === '__more') return openMoreSheet();
    navigate(btn.dataset.tab);
  }));
  updateTabBar(location.hash.slice(1) || 'home');
}

function updateTabBar(route) {
  const bar = $('#tabBar');
  if (!bar) return;
  const isMore = moreRoutes().some(r => r.route === route);
  $$('.tab-item', bar).forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === route || (btn.dataset.tab === '__more' && isMore));
  });
}

function openMoreSheet() {
  const actions = moreRoutes().map(r => ({ label: r.label, icon: r.icon, onClick: () => navigate(r.route) }));
  actions.push({ label: 'Cerrar sesión', icon: '🚪', destructive: true, onClick: doLogout });
  ActionSheet.open({
    title: currentUser?.fullName ?? 'Más',
    subtitle: currentUser?.role === 'admin' ? 'Administrador' : 'Asesor',
    groups: [actions, [{ label: 'Cancelar', cancel: true }]],
  });
}

async function doLogout() {
  await api('/api/auth/logout', { method: 'POST' });
  window.location.href = '/app/login.html';
}

async function api(path, opts = {}) {
  const res = await fetch(path, { credentials: 'same-origin', ...opts, headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) } });
  if (res.status === 401) { window.location.href = '/app/login.html'; return; }
  return res;
}

const NAV_ROUTES = [
  { route: 'home', icon: 'home', label: 'Inicio' },
  { route: 'turno', icon: 'clipboard', label: 'Consultar turno' },
  { route: 'recibo', icon: 'receipt', label: 'Descargar recibo' },
  { route: 'metricas', icon: 'chart', label: 'Métricas' },
  { route: 'conversaciones', icon: 'message', label: 'Conversaciones' },
  { route: 'posgrados', icon: 'cap', label: 'Posgrados' },
  { route: 'registros', icon: 'users', label: 'CRM · Prospectos' },
  { route: 'health', icon: 'pulse', label: 'Estado del sistema' },
];

function renderSidebarNav() {
  const nav = $('#nav');
  nav.innerHTML = NAV_ROUTES.map(r => `<a data-route="${r.route}">${icon(r.icon)}${r.label}</a>`).join('')
    + (currentUser?.role === 'admin' ? `<a data-route="actividad">${icon('pulse')}Actividad de asesores</a><a data-route="usuarios" id="navUsuarios">${icon('users')}Asesores</a>` : '');
  $$('#nav a').forEach(a => a.addEventListener('click', e => {
    e.preventDefault();
    navigate(a.dataset.route);
  }));
}

async function init() {
  const r = await api('/api/auth/me');
  if (!r) return;
  const data = await r.json();
  currentUser = data.user;
  if (data.urls) publicUrls = data.urls;
  if (data.capabilities) capabilities = data.capabilities;
  $('#userName').textContent = currentUser.fullName;
  $('#userRole').textContent = currentUser.role === 'admin' ? 'Administrador' : 'Asesor';
  renderSidebarNav();

  $('#logoutBtn').innerHTML = `${icon('logout', 15)}<span>Cerrar sesión</span>`;
  $('#logoutBtn').addEventListener('click', doLogout);

  renderTabBar();
  navigate(location.hash.slice(1) || 'home');
  window.addEventListener('hashchange', () => {
    const route = location.hash.slice(1) || 'home';
    if (route === currentRoute) return; // ya renderizada por navigate() al fijar el hash — evita doble render
    navigate(route);
  });
}

let currentRoute = null;
function navigate(route) {
  currentRoute = route;
  ActionSheet.close();
  $$('#nav a').forEach(a => a.classList.toggle('active', a.dataset.route === route));
  updateTabBar(route);
  location.hash = route;
  const main = $('#main');
  main.classList.remove('page-enter');
  const render = {
    home: renderHome, turno: renderTurno, recibo: renderRecibo, metricas: renderMetricas,
    conversaciones: renderConversaciones, posgrados: renderPosgrados, registros: renderRegistros,
    health: renderHealth, usuarios: renderUsuarios, actividad: renderActividad,
  }[route];
  const result = render ? render(main) : (main.innerHTML = '<div class="card">Página no encontrada</div>');
  requestAnimationFrame(() => main.classList.add('page-enter'));
  return result;
}

function dateLabelToday() {
  const s = new Date().toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long' });
  return s.charAt(0).toUpperCase() + s.slice(1);
}

      <span class="quick-body"><div class="quick-title">${item.label}</div><div class="quick-sub">${item.sub}</div></span>
      <span class="quick-chevron">${icon('chevronRight', 15)}</span>
    </button>
  `).join('');
  $$('#quickAccess .quick-row').forEach((b, i) => b.addEventListener('click', () => QUICK_ITEMS[i].go()));

  async function openChatwootExternal() {
    try {
      const r = await api('/api/auth/chatwoot-sso');
      const { url } = await r.json();
      window.open(url, '_blank', 'noopener');
    } catch {
      window.open(publicUrls.chatwoot, '_blank', 'noopener');
    }
  }

  $('#seeAllActivity')?.addEventListener('click', () => navigate('actividad'));

  // ── "Requiere atención": combina datos reales de bot-users, Chatwoot y salud ──
  (async () => {
    const rows = [];
    try {
      const [botUsersRes, chatwootRes, healthRes] = await Promise.allSettled([
        api('/api/tools/bot-users').then(r => r.json()),
        api('/api/tools/chatwoot/summary').then(r => r.json()),
        fetch('/health/deep', { credentials: 'same-origin' }).then(r => r.json()),
      ]);
      if (chatwootRes.status === 'fulfilled') {
        const cw = chatwootRes.value;
        if (cw.unassigned > 0) rows.push({ tone: 'danger', html: `<strong>${cw.unassigned}</strong> conversación${cw.unassigned !== 1 ? 'es' : ''} sin asignar en Chatwoot`, go: 'conversaciones' });
        if (cw.pending > 0) rows.push({ tone: 'warning', html: `<strong>${cw.pending}</strong> conversación${cw.pending !== 1 ? 'es' : ''} pendiente${cw.pending !== 1 ? 's' : ''} de responder`, go: 'conversaciones' });
      }
      if (healthRes.status === 'fulfilled') {
        const bad = Object.entries(healthRes.value.checks ?? {}).filter(([, c]) => c.status === 'down' || c.status === 'degraded');
        bad.forEach(([name, c]) => rows.push({ tone: c.status === 'down' ? 'danger' : 'warning', html: `Servicio <strong>${name.replace(/_/g, ' ')}</strong> ${c.status === 'down' ? 'caído' : 'degradado'}`, go: 'health' }));
      }
      if (botUsersRes.status === 'fulfilled' && botUsersRes.value.phones?.length) {
        // No hay endpoint de conteo de baneados; se omite salvo que ya se vea en la bandeja.
      }
    } catch { /* noop */ }

    const list = $('#attentionList');
    if (!rows.length) {
      list.innerHTML = `<div class="widget-empty">${icon('check', 16)} Todo al día — nada requiere atención ahora mismo.</div>`;
      return;
    }
    list.innerHTML = rows.slice(0, 6).map(r => `
      <button type="button" class="attention-row" data-go="${r.go}" style="width:100%;background:none;border:none;text-align:left;cursor:pointer;font-family:inherit;">
        <span class="attention-dot ${r.tone}"></span>
        <span class="attention-text">${r.html}</span>
        <span class="quick-chevron">${icon('chevronRight', 14)}</span>
      </button>
    `).join('');
    $$('#attentionList [data-go]').forEach(b => b.addEventListener('click', () => navigate(b.dataset.go)));
  })();

  // ── Widget de rol: admin ve actividad del equipo, asesor ve la suya ──
  (async () => {
    const body = $('#roleWidgetBody');
    try {
      if (isAdmin) {
        const r = await api('/api/tools/audit/summary?days=7');
        const { summary } = await r.json();
        const rows = Object.entries(summary).map(([username, counts]) => ({
          username, total: Object.values(counts).reduce((a, b) => a + b, 0),
        })).sort((a, b) => b.total - a.total);
        if (!rows.length) { body.innerHTML = `<div class="widget-empty">${icon('check', 16)} Aún no hay actividad registrada esta semana.</div>`; return; }
        const max = Math.max(...rows.map(r => r.total), 1);
        body.innerHTML = rows.slice(0, 6).map(r => `
          <div class="advisor-bar-row">
            <div class="advisor-bar-name">${escapeHtml(r.username)}</div>
            <div class="advisor-bar-track"><div class="advisor-bar-fill" style="width:${Math.round(r.total / max * 100)}%"></div></div>
            <div class="advisor-bar-value">${r.total}</div>
          </div>
        `).join('');
      } else {
        const r = await api('/api/tools/audit/me');
        const { entries } = await r.json();
        if (!entries.length) { body.innerHTML = `<div class="widget-empty">${icon('check', 16)} Aún no has hecho acciones en el panel hoy.</div>`; return; }
        body.innerHTML = entries.slice(0, 6).map(e => {
          const meta = AUDIT_LABELS[e.action] ?? { label: e.action, icon: '•' };
          return `<div class="activity-row"><span class="activity-dot"></span><span class="activity-text">${meta.icon} ${meta.label}${e.detail ? ` — ${escapeHtml(e.detail)}` : ''}</span><span class="activity-time">${relativeTime(e.ts)}</span></div>`;
        }).join('');
      }
    } catch {
      body.innerHTML = '<div class="alert alert-error" style="margin:4px;">No se pudo cargar la actividad.</div>';
    }
  })();

  try {
    const r = await api('/api/tools/metrics/today');
    const { metrics: m } = await r.json();
    const num = (k) => parseInt(m[k] ?? '0') || 0;
    const totalMsgs = num('menu_shown') + num('ai_request') + num('turno_consultado') + num('recibo_descargado');
    const setStat = (k, v) => { const el = document.querySelector(`[data-stat="${k}"]`); el.classList.remove('skeleton'); el.classList.add('count-up'); el.textContent = '0'; countUp(el, v); };
    setStat('msgs', totalMsgs);
    setStat('ai', num('ai_request'));
    setStat('prospectos', num('prospecto_completado'));
    setStat('handoffs', num('agent_handoff'));
  } catch {
    $$('.stat-card .value').forEach(el => { el.classList.remove('skeleton'); el.textContent = '—'; });
  }
}

/* ============= RECIBO ============= */
function renderRecibo(main) {
  main.innerHTML = `
    <div class="page-header">
      <div><h1>🧾 Descargar recibo de matrícula</h1><div class="subtitle">Tooli ingresa al portal Iceberg con las credenciales del estudiante y descarga el recibo.</div></div>
    </div>
    <div class="tool-panel">
      <form id="reciboForm">
        <div class="field">
          <label>Código estudiantil</label>
          <input type="text" id="rCodigo" placeholder="T00012345" required>
        </div>
        <div class="field">
          <label>Cédula</label>
          <input type="text" id="rCedula" placeholder="1001234567" required>
          <div class="field-help">Solo dígitos, sin puntos ni guiones</div>
        </div>
        <button type="submit" class="btn btn-primary" id="reciboBtn">Descargar PDF</button>
      </form>

      <div id="reciboAlert"></div>
    </div>
  `;

  $('#reciboForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const codigo = $('#rCodigo').value.trim().toUpperCase();
    const cedula = $('#rCedula').value.trim();
    const btn = $('#reciboBtn');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Descargando…';
    $('#reciboAlert').innerHTML = `
      <div class="alert alert-info" style="display:flex;align-items:center;gap:16px;">
        ${buildProgressRing('reciboProgress')}
        <div>
          <div style="font-weight:600;margin-bottom:2px;">Ingresando al portal Iceberg…</div>
          <div style="font-size:12px;opacity:0.85;">Puede tardar hasta un minuto. No cierres esta pestaña.</div>
        </div>
      </div>`;
    let pct = 4;
    setProgress('reciboProgress', pct);
    const progTimer = setInterval(() => {
      pct = Math.min(92, pct + (Math.random() * 5 + 1));
      setProgress('reciboProgress', pct);
    }, 500);
    try {
      const res = await fetch('/api/tools/recibo', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ codigo, cedula }),
      });
      clearInterval(progTimer);
      if (res.status === 401) { window.location.href = '/app/login.html'; return; }
      const ct = res.headers.get('content-type') || '';
      if (ct.includes('application/pdf')) {
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `recibo-${codigo}.pdf`; a.click();
        URL.revokeObjectURL(url);
        setProgress('reciboProgress', 100);
        haptic([15, 40, 15]);
        $('#reciboAlert').innerHTML = `<div class="alert alert-success" style="text-align:center;">${successCheckSvg()}<div style="margin-top:8px;font-weight:600;">PDF descargado correctamente</div></div>`;
      } else {
        const err = await res.json();
        const msg = err.noRecibos ? `No hay recibos pendientes${err.nombre ? ` para ${err.nombre}` : ''}.` :
                    err.error === 'login_failed' ? 'Las credenciales no son válidas. Verifica el código y la cédula.' :
                    err.error === 'codigo_invalido' ? 'Formato de código inválido.' :
                    err.error === 'cedula_invalida' ? 'Formato de cédula inválido.' :
                    'No se pudo descargar el recibo.';
        haptic([20, 30, 20]);
        $('#reciboAlert').innerHTML = `<div class="alert alert-error">${msg}</div>`;
      }
    } catch {
      clearInterval(progTimer);
      haptic([20, 30, 20]);
      $('#reciboAlert').innerHTML = '<div class="alert alert-error">Error de conexión.</div>';
    } finally {
      btn.disabled = false; btn.textContent = 'Descargar PDF';
    }
  });
}

const EVENT_META = {
  menu_shown:               { label: 'Menú mostrado',        icon: '📲', color: '#64748b' },
  ai_request:                { label: 'Preguntas a la IA',    icon: '🤖', color: '#7c3aed' },
  ai_disabled_escalation:    { label: 'Escaladas (IA apagada)', icon: '🙋', color: '#f59e0b' },
  turno_consultado:          { label: 'Turnos consultados',   icon: '📋', color: '#0284c7' },
  recibo_descargado:         { label: 'Recibos descargados',  icon: '🧾', color: '#0ea5e9' },
  prospecto_iniciado:        { label: 'Prospectos iniciados', icon: '🎓', color: '#38bdf8' },
  prospecto_completado:      { label: 'Prospectos completados', icon: '🎓', color: '#22c55e' },
  registro_iniciado:         { label: 'Registros BD iniciados', icon: '📝', color: '#eab308' },
  registro_completado:       { label: 'Registros BD completados', icon: '📝', color: '#a855f7' },
  agent_handoff:             { label: 'Casos escalados a asesor', icon: '🙋', color: '#ec4899' },
  programas_especializaciones: { label: 'Especializaciones consultadas', icon: '🎓', color: '#38bdf8' },
  programas_maestrias:      { label: 'Maestrías consultadas', icon: '🎓', color: '#a855f7' },
  programas_doctorados:     { label: 'Doctorados consultados', icon: '🎓', color: '#ec4899' },
};
function eventMeta(key) {
  return EVENT_META[key] ?? { label: key.replace(/_/g, ' ').replace(/^./, c => c.toUpperCase()), icon: '📊', color: '#64748b' };
}

let metricsCharts = [];
function destroyMetricsCharts() { metricsCharts.forEach(c => c.destroy()); metricsCharts = []; }

async function renderMetricas(main) {
  destroyMetricsCharts();
  main.innerHTML = `
    <div class="page-header">
      <div><h1>📊 Métricas del bot</h1><div class="subtitle">Actividad general de Tooli — no solo posgrados</div></div>
      <div id="metRangeWrap"></div>
    </div>
    <div id="metricsContent">
      <div class="stats-grid stagger-in" style="margin-bottom:16px;">
        ${Array.from({ length: 4 }).map(() => `<div class="stat-card"><div class="skeleton skeleton-line" style="width:70px;height:11px;margin-bottom:8px;"></div><div class="skeleton skeleton-line" style="width:50px;height:26px;"></div></div>`).join('')}
      </div>
      <div class="card" style="margin-bottom:16px;"><div class="skeleton" style="height:220px;border-radius:12px;"></div></div>
      <div class="widget-card"><div class="widget-card-head"><h3>Eventos por tipo</h3></div>
        ${Array.from({ length: 6 }).map(() => `<div class="skeleton skeleton-line" style="height:13px;margin:14px 20px;"></div>`).join('')}
      </div>
    </div>
  `;

  let metDays = '7';
  $('#metRangeWrap').appendChild(buildSegmented(
    [{ value: '7', label: '7 días' }, { value: '14', label: '14 días' }, { value: '30', label: '30 días' }],
    metDays,
    (value) => { metDays = value; loadMetrics(); },
  ));

  async function loadMetrics() {
    destroyMetricsCharts();
    try {
      const r = await api(`/api/tools/metrics/range?days=${metDays}`);
      const { days } = await r.json();
      const dateKeys = Object.keys(days).sort();
      const numv = (obj, k) => parseInt(obj?.[k] ?? '0') || 0;

      const totals = {};
      for (const day of Object.values(days)) {
        for (const [k, v] of Object.entries(day)) {
          if (k.includes(':')) continue;
          totals[k] = (totals[k] ?? 0) + (parseInt(v) || 0);
        }
      }
      const rows = Object.entries(totals).sort((a, b) => b[1] - a[1]);
      const maxVal = Math.max(1, ...rows.map(([, v]) => v));

      const totalMsgs = numv({ ...totals }, 'menu_shown') + (totals.ai_request ?? 0) + (totals.turno_consultado ?? 0) + (totals.recibo_descargado ?? 0);

      $('#metricsContent').innerHTML = `
        <div class="stats-grid stagger-in" style="margin-bottom:16px;">
          <div class="stat-card"><div class="label">Mensajes totales</div><div class="value">${totalMsgs}</div></div>
          <div class="stat-card"><div class="label">Preguntas IA</div><div class="value">${totals.ai_request ?? 0}</div></div>
          <div class="stat-card"><div class="label">Prospectos</div><div class="value">${totals.prospecto_completado ?? 0}</div></div>
          <div class="stat-card"><div class="label">Casos a asesor</div><div class="value">${totals.agent_handoff ?? 0}</div></div>
        </div>

        <div class="card" style="margin-bottom:16px;">
          <h3 style="font-size:13px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:16px;">Tendencia diaria</h3>
          <div style="position:relative;height:240px;"><canvas id="metChartDaily"></canvas></div>
        </div>

        <div class="widget-card">
          <div class="widget-card-head"><h3>Eventos por tipo</h3></div>
          <div class="event-bars">
            ${rows.length === 0 ? `<p style="color:var(--text-muted);text-align:center;padding:24px 0;">Sin actividad registrada en este rango.</p>` : rows.map(([k, v]) => {
              const meta = eventMeta(k);
              const pct = Math.max(4, Math.round(v / maxVal * 100));
              return `
                <div class="event-bar-row">
                  <span class="event-bar-icon">${meta.icon}</span>
                  <div class="event-bar-body">
                    <div class="event-bar-top"><span class="event-bar-label">${escapeHtml(meta.label)}</span><span class="event-bar-value">${v}</span></div>
                    <div class="event-bar-track"><div class="event-bar-fill" style="width:${pct}%;background:${meta.color};"></div></div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>

        <p style="margin-top:16px;font-size:13px;color:var(--text-muted);">
          Para métricas técnicas (latencia, errores, uso de recursos), abre <a href="${publicUrls.grafana}" target="_blank">Grafana</a>.
        </p>
      `;

      await loadScript('https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js');
      const topKeys = rows.slice(0, 4).map(([k]) => k);
      const ticks = { color: '#94a3b8' };
      const grid = { color: '#e2e8f0' };
      metricsCharts.push(new Chart(document.getElementById('metChartDaily'), {
        type: 'line',
        data: {
          labels: dateKeys.map(d => d.slice(5)),
          datasets: topKeys.map(k => ({
            label: eventMeta(k).label,
            data: dateKeys.map(d => numv(days[d], k)),
            borderColor: eventMeta(k).color, backgroundColor: eventMeta(k).color + '33',
            tension: 0.3, fill: true,
          })),
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { labels: { color: '#64748b' } } },
          scales: { x: { ticks, grid }, y: { ticks, grid, beginAtZero: true } },
        },
      }));
    } catch (err) {
      console.error(err);
      $('#metricsContent').innerHTML = '<div class="alert alert-error">No se pudieron cargar las métricas.</div>';
    }
  }

  loadMetrics();
}

const AVATAR_TONES = ['#0284c7', '#7c3aed', '#059669', '#d97706', '#db2777', '#0d9488'];
function avatarTone(seed) {
  let h = 0;
  for (const ch of String(seed)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return AVATAR_TONES[h % AVATAR_TONES.length];
}
function initialsFor(phone, nombre) {
  if (nombre) return nombre.trim().split(/\s+/).slice(0, 2).map(s => s[0]).join('').toUpperCase();
  return String(phone).slice(-2);
}
function relativeTime(ts) {
  const diff = Date.now() - ts;
  const min = Math.round(diff / 60000);
  if (min < 1) return 'ahora';
  if (min < 60) return `${min} min`;
  const hr = Math.round(min / 60);
  if (hr < 24) return `${hr} h`;
  const days = Math.round(hr / 24);
  if (days < 7) return `${days} d`;
  return new Date(ts).toLocaleDateString('es-CO', { day: '2-digit', month: 'short' });
}
function friendlyDate(raw) {
  if (!raw) return '';
  const d = new Date(raw);
  if (isNaN(d.getTime())) return raw;
  return d.toLocaleDateString('es-CO', { day: '2-digit', month: 'short', year: 'numeric' }) +
    ' · ' + d.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
}

/* Categoriza la conversación según el paso de flujo real (no es un campo
   inventado: son los mismos nombres de `step` que usan los flujos en
   src/flows — programas/registro/prospecto son de posgrado, turno/recibo
   son de pregrado/matrícula). Si no hay sesión activa, queda "Sin flujo". */
const FLOW_CATEGORIES = {
  posgrado: { label: 'Posgrado', color: '#7c3aed', prefixes: ['programas_', 'registro_', 'prospecto_'] },
  pregrado: { label: 'Pregrado', color: '#0284c7', prefixes: ['esperando_codigo', 'recibo_'] },
  evento: { label: 'Evento', color: '#db2777', prefixes: ['evento_'] },
  soporte: { label: 'Soporte', color: '#64748b', prefixes: ['agent_', 'ti_', 'with_agent', 'chatting_with_ai'] },
};
function flowCategory(step) {
  if (!step || step === 'menu') return null;
  for (const [key, cat] of Object.entries(FLOW_CATEGORIES)) {
    if (cat.prefixes.some(p => step.startsWith(p))) return { key, ...cat };
  }
  return null;
}

/* Swipe-to-reveal (patrón Mail/iOS): arrastra la fila para revelar acciones */
function attachSwipeRow(row) {
  const content = row.querySelector('.swipe-content');
  const actionsEl = row.querySelector('.swipe-actions');
  const REVEAL = Math.ceil(actionsEl?.getBoundingClientRect().width || 140);
  let startX = 0, startY = 0, dx = 0, dragging = false, decided = false, isHorizontal = false;

  const closeAllOthers = () => $$('.swipe-row.swiped').forEach(r => { if (r !== row) { r.classList.remove('swiped'); r.style.setProperty('--swipe-x', '0px'); } });

  row.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse') return;
    startX = e.clientX; startY = e.clientY; dx = 0; dragging = true; decided = false; isHorizontal = false;
    content.style.transition = 'none';
  });
  row.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const rawDx = e.clientX - startX;
    const rawDy = e.clientY - startY;
    if (!decided) {
      if (Math.abs(rawDx) > 8 || Math.abs(rawDy) > 8) { decided = true; isHorizontal = Math.abs(rawDx) > Math.abs(rawDy); }
      else return;
    }
    if (!isHorizontal) { dragging = false; return; }
    e.preventDefault();
    const base = row.classList.contains('swiped') ? -REVEAL : 0;
    dx = Math.min(0, Math.max(-REVEAL - 24, base + rawDx));
    content.style.transform = `translateX(${dx}px)`;
  });
  const finish = () => {
    if (!dragging) return;
    dragging = false;
    content.style.transition = '';
    content.style.transform = '';
    if (dx < -REVEAL / 2) { row.classList.add('swiped'); row.style.setProperty('--swipe-x', `-${REVEAL}px`); haptic(10); closeAllOthers(); }
    else { row.classList.remove('swiped'); row.style.setProperty('--swipe-x', '0px'); }
  };
  row.addEventListener('pointerup', finish);
  row.addEventListener('pointercancel', finish);
  content.querySelector('.inbox-row').addEventListener('click', (e) => {
    if (row.classList.contains('swiped')) { e.preventDefault(); e.stopImmediatePropagation(); row.classList.remove('swiped'); row.style.setProperty('--swipe-x', '0px'); }
  }, { capture: true });
}

      toast(enabled ? 'IA activada para esta conversación' : 'IA apagada — escalará a un asesor');
    });
    $('#threadMenuBtn').addEventListener('click', () => ActionSheet.open({

        { label: info.banned ? 'Desbanear' : 'Banear', icon: '⛔', destructive: !info.banned, onClick: () => quickAction(phone, info.banned ? 'unban' : 'ban').then(() => openThread(phone)) },
      ], [{ label: 'Cancelar', cancel: true }]],

  } catch {

}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function groupMessages(msgs) {
  const GROUP_MS = 3 * 60 * 1000;
  const groups = [];
  msgs.forEach((m, i) => {
    const prev = msgs[i - 1];
    const sameGroup = prev && prev.direction === m.direction && (m.ts - prev.ts) < GROUP_MS;
    if (sameGroup) groups[groups.length - 1].push(m); else groups.push([m]);
  });
  return groups;
}

async function previewPhoneFor(phone) {
  try {
    const r = await api(`/api/tools/bot-users/${phone}`);
    const info = await r.json();
    const nombre = info.session?.data?.nombre;
    const msgs = [...info.recentMessages].reverse();
    openPhonePreview(phone, nombre, groupMessages(msgs));
  } catch {
    toast('No se pudo cargar la conversación');
  }
}

/* ============= PERFIL (asesor / estudiante) ============= */
/* Modal genérico de "perfil" reutilizado por Asesores y por el CRM de
   estudiantes: avatar grande, insignias, métricas y una lista de datos —
   siempre con la información real ya disponible, nunca inventada. */
function openProfileSheet({ avatarBg, avatarText, title, subtitle, badges = [], stats = [], rows = [], actions = [] }) {
  haptic(15);
  const overlay = document.createElement('div');
  overlay.className = 'profile-sheet-overlay';
  overlay.innerHTML = `
    <div class="profile-sheet">
      <button type="button" class="profile-sheet-close" aria-label="Cerrar">${icon('x', 16)}</button>
      <div class="profile-sheet-header">
        <div class="avatar" style="background:${avatarBg};width:64px;height:64px;font-size:22px;">${escapeHtml(avatarText)}</div>
        <div class="profile-sheet-title">${escapeHtml(title)}</div>
        ${subtitle ? `<div class="profile-sheet-subtitle">${escapeHtml(subtitle)}</div>` : ''}
        ${badges.length ? `<div class="profile-sheet-badges">${badges.map(b => `<span class="badge" style="background:${b.color}22;color:${b.color};">${escapeHtml(b.label)}</span>`).join('')}</div>` : ''}
      </div>
      ${stats.length ? `<div class="profile-sheet-stats">${stats.map(s => `<div class="profile-sheet-stat"><div class="value">${escapeHtml(String(s.value))}</div><div class="label">${escapeHtml(s.label)}</div></div>`).join('')}</div>` : ''}
      ${rows.length ? `<div class="profile-sheet-rows">${rows.map(r => `<div class="profile-sheet-row"><span class="profile-sheet-row-icon">${r.icon ?? ''}</span><span class="profile-sheet-row-label">${escapeHtml(r.label)}</span><span class="profile-sheet-row-value">${escapeHtml(String(r.value ?? '—'))}</span></div>`).join('')}</div>` : ''}
      ${actions.length ? `<div class="profile-sheet-actions">${actions.map((a, i) => `<button type="button" class="btn ${a.primary ? 'btn-primary' : 'btn-secondary'}" style="${a.destructive ? 'color:var(--danger);border-color:var(--danger);' : ''}" data-pa="${i}">${a.icon ?? ''} ${escapeHtml(a.label)}</button>`).join('')}</div>` : ''}
    </div>
  `;
  document.body.appendChild(overlay);
  requestAnimationFrame(() => overlay.classList.add('open'));

  const close = () => {
    overlay.classList.remove('open');
    setTimeout(() => overlay.remove(), 260);
    document.removeEventListener('keydown', onKey);
  };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  overlay.querySelector('.profile-sheet-close').addEventListener('click', close);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  document.addEventListener('keydown', onKey);
  actions.forEach((a, i) => overlay.querySelector(`[data-pa="${i}"]`)?.addEventListener('click', () => {
    a.onClick?.();
    if (a.closeAfter !== false) close();
  }));
  return { close };
}

/* Muestra la conversación dentro de un frame de iPhone con la
   apariencia real de WhatsApp, para que el asesor vea exactamente
   lo que ve el estudiante — no una recreación aproximada del hilo. */
function openPhonePreview(phone, nombre, groups) {
  haptic(15);
  const overlay = document.createElement('div');
  overlay.className = 'phone-preview-overlay';
  const now = new Date();
  const clock = now.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit', hour12: false });

  overlay.innerHTML = `
    <button type="button" class="phone-preview-close" aria-label="Cerrar">${icon('x', 20)}</button>
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="phone-screen">
        <div class="wa-statusbar"><span>${clock}</span><span class="wa-statusbar-icons">📶 📳 🔋</span></div>
        <div class="wa-header">
          <span class="wa-back">${icon('chevronLeft', 20)}</span>
          <div class="avatar" style="background:${avatarTone(phone)};width:34px;height:34px;font-size:13px;">${initialsFor(phone, nombre)}</div>
          <div class="wa-header-name">
            <div>${nombre ? escapeHtml(nombre) : `+${phone}`}</div>
            <div class="wa-header-sub">en línea</div>
          </div>
          <span class="wa-header-icons">📹 📞 ⋮</span>
        </div>
        <div class="wa-messages">
          ${groups.length === 0 ? '<div class="wa-empty">No hay mensajes registrados.</div>' : groups.map(g => g.map((m, i) => `
            <div class="wa-bubble-row ${m.direction === 'out' ? 'me' : 'them'}">
              <div class="wa-bubble ${m.direction === 'out' ? 'me' : 'them'}">
                ${escapeHtml(m.text)}
                <span class="wa-bubble-meta">${new Date(m.ts).toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' })}${m.direction === 'out' ? ' <span class=\"wa-ticks\">✓✓</span>' : ''}</span>
              </div>
            </div>
          `).join('')).join('')}
        </div>
        <div class="wa-composer">
          <span class="wa-composer-input">Escribe un mensaje</span>
          <span class="wa-composer-mic">🎤</span>
        </div>
        <div class="phone-home-indicator"></div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  requestAnimationFrame(() => overlay.classList.add('open'));
  const wrap = overlay.querySelector('.wa-messages');
  if (wrap) wrap.scrollTop = wrap.scrollHeight;

  const close = () => {
    haptic(10);
    overlay.classList.remove('open');
    setTimeout(() => overlay.remove(), 280);
    document.removeEventListener('keydown', onKey);
  };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  overlay.querySelector('.phone-preview-close').addEventListener('click', close);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  document.addEventListener('keydown', onKey);
}

/* ============= POSGRADOS ============= */
let pgCharts = [];

function destroyPgCharts() {
  pgCharts.forEach(c => c.destroy());
  pgCharts = [];
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    if (document.querySelector(`script[src="${src}"]`)) { resolve(); return; }
    const s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}

  destroyPgCharts();

            <div class="label">Doctorados</div>
            <div class="value">${doctorados}</div>

      };

/* ============= REGISTROS BD (CRM de prospectos) ============= */
function programaCategoria(programa) {
  const p = (programa || '').toLowerCase();
  if (p.includes('doctorado')) return 'doctorado';
  if (p.includes('maestr')) return 'maestria';
  if (p.includes('especial')) return 'especializacion';
  return 'otro';
}
const PROGRAMA_LABELS = { especializacion: 'Especialización', maestria: 'Maestría', doctorado: 'Doctorado', otro: 'Otro' };
const PROGRAMA_COLORS = { especializacion: '#0284c7', maestria: '#7c3aed', doctorado: '#db2777', otro: '#64748b' };

let crmRows = [];
let crmFilter = 'todos';

async function renderRegistros(main) {
  main.innerHTML = `

      <div><h1>📝 CRM — Prospectos de posgrado</h1><div class="subtitle">Quienes completaron el registro vía WhatsApp</div></div>

    </div>
    <div class="crm-toolbar">
      <input type="text" id="crmSearch" placeholder="Buscar por nombre, email o programa…">
      <div id="crmFilterWrap"></div>
    </div>
    <div id="regContent">
      <div class="crm-grid stagger-in">
        ${Array.from({ length: 6 }).map(() => `
          <div class="crm-card">
            <div class="skeleton" style="width:44px;height:44px;border-radius:50%;margin-bottom:12px;"></div>
            <div class="skeleton skeleton-line" style="width:70%;height:14px;margin-bottom:8px;"></div>
            <div class="skeleton skeleton-line" style="width:90%;height:11px;"></div>
          </div>
        `).join('')}
      </div>
    </div>
  `;

  $('#crmSearch').addEventListener('input', renderCrmGrid);

  async function loadReg() {
    $('#refreshReg').querySelector('.refresh-icon')?.classList.add('spin-once');
    try {
      const r = await api('/api/tools/registros-posgrado');
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const { rows } = await r.json();
      crmRows = rows ?? [];
      if (!crmRows.length) {
        $('#regContent').innerHTML = `<div class="card"><p style="color:var(--text-muted);text-align:center;padding:24px 0;">No hay registros aún. Cuando un prospecto complete el formulario del bot, aparecerá aquí.</p></div>`;
        $('#crmFilterWrap').innerHTML = '';
        return;
      }
      const counts = crmRows.reduce((acc, row) => { const c = programaCategoria(row[4]); acc[c] = (acc[c] ?? 0) + 1; return acc; }, {});
      $('#crmFilterWrap').innerHTML = '';
      $('#crmFilterWrap').appendChild(buildSegmented(
        [
          { value: 'todos', label: `Todos (${crmRows.length})` },
          ...Object.keys(PROGRAMA_LABELS).filter(k => counts[k]).map(k => ({ value: k, label: `${PROGRAMA_LABELS[k]} (${counts[k]})` })),

        crmFilter, (v) => { crmFilter = v; renderCrmGrid(); },
      ));

      console.error(err);
      $('#regContent').innerHTML = '<div class="alert alert-error">No se pudieron cargar los registros. Verifica que el Sheet esté configurado.</div>';
    }
  }

  function renderCrmGrid() {
    const q = ($('#crmSearch')?.value ?? '').trim().toLowerCase();
    const filtered = crmRows.filter((row, i) => {
      row.__i = i;
      if (crmFilter !== 'todos' && programaCategoria(row[4]) !== crmFilter) return false;

      return [row[1], row[2], row[4]].some(v => (v ?? '').toLowerCase().includes(q));
    });
    if (!filtered.length) { $('#regContent').innerHTML = '<div class="card"><p style="color:var(--text-muted);text-align:center;padding:24px 0;">Sin resultados.</p></div>'; return; }

            <div class="avatar" style="background:${avatarTone(nombre)};width:44px;height:44px;font-size:14px;margin-bottom:12px;">${initialsFor(row[3] || nombre, nombre)}</div>
            <div class="crm-card-name">${escapeHtml(nombre)}</div>
            ${row[4] ? `<span class="badge" style="background:${PROGRAMA_COLORS[cat]}22;color:${PROGRAMA_COLORS[cat]};margin-bottom:8px;">${escapeHtml(row[4])}</span>` : ''}
            <div class="crm-card-row">✉️ ${escapeHtml(row[2] || '—')}</div>
            <div class="crm-card-row">📱 ${escapeHtml(row[3] || '—')}</div>
            <div class="crm-card-date">${escapeHtml(friendlyDate(row[0]))}</div>
          </div>
        `; }).join('')}
      </div>
    `;
    $$('.crm-card[data-longpress]').forEach(card => {
      const row = crmRows[Number(card.dataset.row)];
      card.addEventListener('click', () => openStudentProfile(row));
      contextSheet(card, {
        title: row[1] || 'Prospecto',
        subtitle: row[2] || undefined,
        actions: [
          { label: 'Ver perfil', icon: '👤', onClick: () => openStudentProfile(row) },
          ...(row[3] ? [{ label: 'Vista previa en teléfono', icon: '📲', onClick: () => previewPhoneFor(row[3]) }] : []),
          { label: 'Copiar email', icon: '📧', onClick: () => copyToClipboard(row[2] ?? '', 'Email copiado') },
          { label: 'Copiar WhatsApp', icon: '📱', onClick: () => copyToClipboard(row[3] ?? '', 'Número copiado') },
          { label: 'Ver conversación', icon: '💬', onClick: () => navigate('conversaciones') },
          { label: 'Ver en Chatwoot', icon: '↗️', onClick: () => window.open(`${publicUrls.chatwoot}/app/accounts/1/label/posgrado-prospecto`, '_blank', 'noopener') },
        ],
      });
    });
  }

  /* Perfil del estudiante: combina lo que ya sabemos del registro (CRM) con
     lo que el bot tiene guardado de su conversación (categoría de flujo,
     último mensaje) — todo dato real, nada inventado tipo Savia. */
  async function openStudentProfile(row) {
    const [fecha, nombre, email, phone, programa] = row;
    const cat = programaCategoria(programa);
    let flowInfo = null;
    if (phone) {
      try {
        const r = await api(`/api/tools/bot-users/${phone}`);
        const info = await r.json();
        flowInfo = { step: flowCategory(info.session?.step), last: info.recentMessages?.[0] ?? null, banned: info.banned };
      } catch { /* sin datos de conversación disponibles */ }
    }
    openProfileSheet({
      avatarBg: avatarTone(nombre || phone), avatarText: initialsFor(phone || nombre, nombre),
      title: nombre || 'Prospecto', subtitle: email || (phone ? `+${phone}` : undefined),
      badges: [
        ...(programa ? [{ label: programa, color: PROGRAMA_COLORS[cat] }] : []),
        ...(flowInfo?.step ? [{ label: flowInfo.step.label, color: flowInfo.step.color }] : []),
        ...(flowInfo?.banned ? [{ label: 'Baneado', color: '#dc2626' }] : []),
      ],
      rows: [
        ...(email ? [{ icon: '📧', label: 'Email', value: email }] : []),
        ...(phone ? [{ icon: '📱', label: 'WhatsApp', value: `+${phone}` }] : []),
        ...(programa ? [{ icon: '🎓', label: 'Programa de interés', value: programa }] : []),
        { icon: '🗓️', label: 'Registrado', value: friendlyDate(fecha) },
        ...(flowInfo?.last ? [{ icon: '💬', label: 'Último mensaje', value: flowInfo.last.text }] : []),
      ],
      actions: [
        ...(phone ? [{ label: 'Vista previa en teléfono', icon: '📲', onClick: () => previewPhoneFor(phone), closeAfter: false }] : []),
        ...(phone ? [{ label: 'Ver conversación', icon: '💬', onClick: () => navigate('conversaciones') }] : []),
        { label: 'Ver en Chatwoot', icon: '↗️', onClick: () => window.open(`${publicUrls.chatwoot}/app/accounts/1/label/posgrado-prospecto`, '_blank', 'noopener') },
      ],
    });
  }

  $('#refreshReg').addEventListener('click', loadReg);
  loadReg();
}

/* ============= MODO SIN CONEXIÓN ============= */
/* Cache del app shell vía Service Worker (ver sw.js) para que la app cargue
   rápido y siga disponible con mala conexión. Los datos (todo lo que pasa
   por /api/) nunca se cachean — cuando no hay red, cada pantalla ya muestra
   su propio estado de error, esto solo evita que la app en sí quede en blanco. */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/app/sw.js', { scope: '/app/' }).catch(() => {});
  });
}

function updateOfflineBanner() {
  let banner = $('#offlineBanner');
  if (navigator.onLine) {
    banner?.classList.remove('show');
    return;
  }
  if (!banner) {
    banner = document.createElement('div');
    banner.id = 'offlineBanner';
    banner.className = 'offline-banner';
    banner.innerHTML = `<span class="pulse-dot down"></span> Sin conexión — mostrando lo último guardado`;
    document.body.appendChild(banner);
  }
  requestAnimationFrame(() => banner.classList.add('show'));
}
window.addEventListener('online', updateOfflineBanner);
window.addEventListener('offline', updateOfflineBanner);
updateOfflineBanner();

init();
</script>

</body>
</html>
